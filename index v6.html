<div id="ledger-root">
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-mark">⟡</div>
    <div class="loading-text">Unrolling the ledger…</div>
  </div>
</div>

<style>
  #ledger-root {
    --ink: #14110d;
    --panel: #211c16;

  #ledger-root .catalyst-links { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
  #ledger-root .warning-note {

  #ledger-root .search-controls {

  #ledger-root .detail-title {

<script>
(function() {
  const root = document.getElementById('ledger-root');

  let fliplog = [];
  let taxRate = 2;
  let loaded = false;

  let budgetInput = 100000;
  let speedFilter = 'high';
  let lastSuggestion = null;

  let mappingCache = null;
  let liveItems = [];
  let liveResults = [];
  let liveLoading = false;
  let liveError = null;
  let liveFetchedAt = null;
  let liveBudget = 100000;
  let liveLiquidity = 'reliable';
  let trendBias = 'rising';
  let trendCache = {};
  let trendLoading = false;
  let suggestionRefreshing = false;
  let suggestionHistory = [];
  let searchQuery = '';
  let searchMatches = [];
  let searchSelected = null;
  let searchLoading = false;

  const STORAGE_KEYS = {
    fliplog: 'osrs_ge_ledger_fliplog',
    settings: 'osrs_ge_ledger_settings',
    suggestion: 'osrs_last_suggestion_v5',
    suggestionHistory: 'osrs_ge_ledger_suggestion_history_v6'
  };

  function readLocalJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('Could not read localStorage key:', key, e);
      return fallback;
    }
  }

  function writeLocalJson(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.warn('Could not write localStorage key:', key, e);
      return false;
    }
  }

  async function loadAll() {
    fliplog = readLocalJson(STORAGE_KEYS.fliplog, []);

    const parsed = readLocalJson(STORAGE_KEYS.settings, {});
    taxRate = typeof parsed.taxRate === 'number' ? parsed.taxRate : 2;
    budgetInput = typeof parsed.budgetInput === 'number' ? parsed.budgetInput : 100000;

    liveBudget = budgetInput;
    lastSuggestion = readLocalJson(STORAGE_KEYS.suggestion, null);
    suggestionHistory = readLocalJson(STORAGE_KEYS.suggestionHistory, []);
    if (!Array.isArray(suggestionHistory)) suggestionHistory = [];

    loaded = true;
    render();
  }


  async function saveLog() {
    writeLocalJson(STORAGE_KEYS.fliplog, fliplog);
  }

  async function saveSettings() {
    writeLocalJson(STORAGE_KEYS.settings, { taxRate, budgetInput });
  }

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(Math.round(n));
    return sign + abs.toLocaleString('en-US');
  }

  const TAX_CAP = 5000000;

  function taxPerUnit(sellPrice) {
    return Math.min(Math.floor(sellPrice * taxRate / 100), TAX_CAP);
  }


  function totalProfit() { return fliplog.reduce((sum, f) => sum + f.profit, 0); }

  function normalizeAggregate(json) {
    const raw = json && json.data ? json.data : {};
    const map = {};
    if (Array.isArray(raw)) {
      raw.forEach(row => { if (row && row.id !== undefined) map[String(row.id)] = row; });
    } else {
      Object.keys(raw || {}).forEach(id => { map[String(id)] = raw[id] || {}; });
    }
    return map;
  }

  function volumeOf(row) {
    if (!row) return 0;
    if (typeof row.volume === 'number') return row.volume;
    return (Number(row.highPriceVolume) || 0) + (Number(row.lowPriceVolume) || 0);
  }

  function sideVolume(row, side) {
    if (!row) return 0;
    const key = side === 'high' ? 'highPriceVolume' : 'lowPriceVolume';
    if (typeof row[key] === 'number') return row[key];
    const v = Number(row.volume) || 0;
    return Math.floor(v / 2);
  }


  function rememberSuggestion(s, addToHistory = true) {
    lastSuggestion = s;
    if (!s || s === 'none') return;
    writeLocalJson(STORAGE_KEYS.suggestion, s);

    if (addToHistory) {
      const now = Date.now();
      const entry = {
        ...s,
        historyId: 'h' + now + Math.random().toString(36).slice(2, 6),
        suggestedAt: s.suggestedAt || now
      };

      const newest = suggestionHistory[0];
      if (newest && String(newest.id) === String(entry.id) &&
          Math.abs(now - Number(newest.suggestedAt || 0)) < 5 * 60 * 1000) {
        entry.historyId = newest.historyId;
        suggestionHistory[0] = entry;
      } else {
        suggestionHistory.unshift(entry);
      }

      suggestionHistory = suggestionHistory.slice(0, 80);
      writeLocalJson(STORAGE_KEYS.suggestionHistory, suggestionHistory);
    }
  }

  function rowMid(row) {
    if (!row) return null;
    const hi = Number(row.avgHighPrice);
    const lo = Number(row.avgLowPrice);
    if (hi > 0 && lo > 0) return (hi + lo) / 2;
    if (hi > 0) return hi;
    if (lo > 0) return lo;
    return null;
  }

  function pctChange(current, previous) {
    if (!(current > 0) || !(previous > 0)) return null;
    return ((current - previous) / previous) * 100;
  }

  function pointAtOrBefore(points, targetTs) {
    let best = null;
    for (const p of points) {
      if (p.timestamp <= targetTs) best = p;
      else break;
    }
    return best;
  }

  function analyzeTrendSeries(rows) {
    const points = (Array.isArray(rows) ? rows : [])
      .map(r => ({ ...r, timestamp: Number(r.timestamp) || 0, mid: rowMid(r) }))
      .filter(r => r.timestamp > 0 && r.mid > 0)
      .sort((a, b) => a.timestamp - b.timestamp);

    if (points.length < 4) return null;

    const latest = points[points.length - 1];
    const oneDay = pointAtOrBefore(points, latest.timestamp - 24 * 3600);
    const threeDay = pointAtOrBefore(points, latest.timestamp - 3 * 24 * 3600);
    const sevenDay = pointAtOrBefore(points, latest.timestamp - 7 * 24 * 3600);

    const ret1d = pctChange(latest.mid, oneDay && oneDay.mid);
    const ret3d = pctChange(latest.mid, threeDay && threeDay.mid);
    const ret7d = pctChange(latest.mid, sevenDay && sevenDay.mid);

    let score = 50;
    if (ret1d !== null) score += Math.max(-14, Math.min(14, ret1d * 1.7));
    if (ret3d !== null) score += Math.max(-16, Math.min(16, ret3d * 1.1));
    if (ret7d !== null) score += Math.max(-20, Math.min(20, ret7d * 0.75));
    score = Math.max(0, Math.min(100, score));

    let direction = 'mixed';
    if ((ret7d ?? 0) > 1.0 && (ret3d ?? 0) > -1.5 && score >= 56) direction = 'rising';
    if ((ret7d ?? 0) < -2.0 && (ret3d ?? 0) < 0 && score < 48) direction = 'falling';

    // Strong short-term surge: useful as a "possible catalyst" flag, not proof that news caused it.
    const catalyst = (ret1d ?? 0) >= 4 || ((ret3d ?? 0) >= 7 && (ret7d ?? 0) >= 7);

    return { ret1d, ret3d, ret7d, score, direction, catalyst, latestMid: latest.mid };
  }

  async function fetchTrendForItem(id, force = false) {
    const key = String(id);
    const cached = trendCache[key];
    if (!force && cached && (Date.now() - cached.at) < 10 * 60 * 1000) return cached.trend;

    try {
      const url = 'https://prices.runescape.wiki/api/v1/osrs/timeseries?timestep=6h&id=' + encodeURIComponent(id);
      const res = await fetch(url);
      if (!res.ok) throw new Error('trend request failed');
      const json = await res.json();
      const trend = analyzeTrendSeries(json.data || []);
      trendCache[key] = { at: Date.now(), trend };
      return trend;
    } catch (e) {
      trendCache[key] = { at: Date.now(), trend: null };
      return null;
    }
  }

  function withTrend(scored) {
    if (!scored) return null;
    const cached = trendCache[String(scored.id)];
    const trend = cached ? cached.trend : null;
    if (!trend) return { ...scored, trend: null };

    let mult = 1;
    if (trend.direction === 'rising') mult = 1.18;
    else if (trend.direction === 'falling') mult = 0.62;
    else if (trend.score >= 55) mult = 1.04;

    // Avoid treating a vertical one-day pump as automatically "safe".
    if ((trend.ret1d ?? 0) > 20 && (trend.ret7d ?? 0) < 5) mult *= 0.8;

    return { ...scored, trend, ranking: scored.ranking * mult };
  }

  function fmtPct(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  }

  function trendLabel(trend) {
    if (!trend) return '<span class="trend unknown">No trend</span>';
    const arrow = trend.direction === 'rising' ? '↑' : trend.direction === 'falling' ? '↓' : '↔';
    return `<span class="trend ${trend.direction}">${arrow} ${trend.direction}</span>`;
  }


  function avgPresent(values, fallback) {
    const clean = values.map(Number).filter(v => v > 0 && isFinite(v));
    return clean.length ? clean.reduce((a, b) => a + b, 0) / clean.length : fallback;
  }

  function clampPrice(v) {
    return Math.max(1, Math.round(Number(v) || 1));
  }

  function targetMath(buy, sell, qty) {
    buy = clampPrice(buy);
    sell = clampPrice(sell);
    const tax = taxPerUnit(sell);
    const margin = sell - tax - buy;
    const pct = buy > 0 ? margin / buy * 100 : 0;
    return {
      buy, sell, tax, margin, pct,
      profit: margin * Math.max(1, Number(qty) || 1)
    };
  }

  function tradeTargets(s) {
    if (!s) return null;

    const latestLow = Number(s.buy) || 0;
    const latestHigh = Number(s.sell) || 0;
    if (!(latestLow > 0) || !(latestHigh > 0)) return null;

    const f5Low = s.five && Number(s.five.avgLowPrice);
    const f5High = s.five && Number(s.five.avgHighPrice);
    const hLow = s.hour && Number(s.hour.avgLowPrice);
    const hHigh = s.hour && Number(s.hour.avgHighPrice);
    const dLow = s.day && Number(s.day.avgLowPrice);
    const dHigh = s.day && Number(s.day.avgHighPrice);

    const quickLow = avgPresent([latestLow, f5Low], latestLow);
    const quickHigh = avgPresent([latestHigh, f5High], latestHigh);
    const quickSpread = Math.max(1, quickHigh - quickLow);

    // Quick: move both offers toward the middle to improve fill odds.
    let quickBuy = quickLow + quickSpread * 0.32;
    let quickSell = quickHigh - quickSpread * 0.32;

    const normalLow = avgPresent([latestLow, f5Low, hLow], latestLow);
    const normalHigh = avgPresent([latestHigh, f5High, hHigh], latestHigh);
    const normalSpread = Math.max(1, normalHigh - normalLow);

    // Normal: smaller concession than Quick.
    let normalBuy = normalLow + normalSpread * 0.14;
    let normalSell = normalHigh - normalSpread * 0.14;

    const observedLows = [latestLow, f5Low, hLow, dLow].map(Number).filter(v => v > 0);
    const observedHighs = [latestHigh, f5High, hHigh, dHigh].map(Number).filter(v => v > 0);

    // Patient: lean toward the better recent observed edges, but cap extrapolation
    // to avoid turning an old average into a fantasy offer.
    const lowEdge = Math.min(...observedLows);
    const highEdge = Math.max(...observedHighs);
    let patientBuy = Math.max(lowEdge, latestLow * 0.98);
    let patientSell = Math.min(highEdge, latestHigh * 1.02);

    // Rising markets can run away from a very low patient bid; falling markets make
    // ambitious overnight sells riskier. Nudge the targets toward current prices.
    if (s.trend && s.trend.direction === 'rising') {
      patientBuy = Math.max(patientBuy, latestLow * 0.992);
    } else if (s.trend && s.trend.direction === 'falling') {
      patientSell = Math.min(patientSell, latestHigh * 1.004);
    }

    const qty = Number(s.qty) > 0 ? Number(s.qty) : 1;
    const quick = targetMath(quickBuy, quickSell, qty);
    const normal = targetMath(normalBuy, normalSell, qty);
    const patient = targetMath(patientBuy, patientSell, qty);

    return { quick, normal, patient };
  }

  function renderTradeTargets(s) {
    const targets = tradeTargets(s);
    if (!targets) return '';

    const card = (key, title, subtitle) => {
      const t = targets[key];
      const cls = t.margin >= 0 ? 'pos' : 'neg';
      return `
        <div class="horizon-card ${key}">
          <div class="horizon-name">${title}</div>
          <div class="s-note" style="margin:0 0 7px">${subtitle}</div>
          <div class="horizon-line"><span>Buy target</span><strong>${fmt(t.buy)}</strong></div>
          <div class="horizon-line"><span>Sell target</span><strong>${fmt(t.sell)}</strong></div>
          <div class="horizon-line"><span>After-tax margin</span><strong class="${cls}">${t.margin >= 0 ? '+' : ''}${fmt(t.margin)}</strong></div>
          <div class="horizon-line"><span>ROI</span><strong class="${cls}">${fmtPct(t.pct)}</strong></div>
          <div class="horizon-line"><span>Est. profit × ${fmt(s.qty || 1)}</span><strong class="${cls}">${t.profit >= 0 ? '+' : ''}${fmt(t.profit)}</strong></div>
        </div>`;
    };

    return `
      <div class="history-title">Offer targets</div>
      <div class="horizon-grid">
        ${card('quick', 'Quick · under 10 min', 'Sacrifices spread for a better chance of filling quickly.')}
        ${card('normal', 'Normal · 1–3 hr', 'Balances fill speed against keeping more of the spread.')}
        ${card('patient', 'Patient · hours / overnight', 'Leans toward better recent market edges; most sensitive to trend risk.')}
      </div>
      <div class="s-note">${Number(s.qty) > 0 ? '' : 'Your current budget does not cover one unit, so target-card profit is shown for 1 item. '}These are price targets inferred from recent trades and averages, not guaranteed fill times. Re-check before placing or adjusting an offer.</div>
    `;
  }

  function compactSnapshot(it, budget) {
    if (!it) return null;
    const scored = scoreLiveItem(it, budget);
    if (scored) return withTrend(scored);

    const net = it.sell - taxPerUnit(it.sell);
    const margin = net - it.buy;
    const pct = it.buy > 0 ? margin / it.buy * 100 : 0;
    const vol5 = volumeOf(it.five);
    const vol1h = volumeOf(it.hour);
    const vol24 = volumeOf(it.day);
    const midpoint = (it.buy + it.sell) / 2;
    const tradedValue24 = midpoint * vol24;
    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const volumeRatio = vol24 / requiredVol24;
    const affordable = Math.max(0, Math.floor((Number(budget) || 0) / Math.max(it.buy, 1)));
    const marketQty = Math.max(1, Math.floor(vol24 * 0.03));
    const qty = affordable > 0 ? Math.min(affordable, it.limit || affordable, marketQty) : 0;
    const cached = trendCache[String(it.id)];

    return {
      ...it, margin, pct, qty, potential: margin * qty, ranking: -Infinity,
      score: 0, confidence: 'low', vol5, vol1h, vol24, tradedValue24,
      requiredVol24, volumeRatio, trend: cached ? cached.trend : null
    };
  }

  function runSearchMatches() {
    const q = searchQuery.trim().toLowerCase();
    if (!q || !liveItems.length) {
      searchMatches = [];
      return;
    }

    searchMatches = liveItems
      .filter(it => it.name && it.name.toLowerCase().includes(q))
      .sort((a, b) => {
        const an = a.name.toLowerCase();
        const bn = b.name.toLowerCase();
        const ae = an === q ? 0 : an.startsWith(q) ? 1 : 2;
        const be = bn === q ? 0 : bn.startsWith(q) ? 1 : 2;
        return ae - be || an.localeCompare(bn);
      })
      .slice(0, 12);
  }

  async function searchItems() {
    searchLoading = true;
    searchSelected = null;
    render();

    if (!liveItems.length) await fetchLiveData(false);
    runSearchMatches();

    searchLoading = false;
    render();
  }

  async function selectSearchItem(id) {
    searchLoading = true;
    render();

    if (!liveItems.length) await fetchLiveData(false);
    await fetchTrendForItem(id, true);
    const it = liveItems.find(x => String(x.id) === String(id));
    searchSelected = it ? compactSnapshot(it, Number(budgetInput) || 0) : null;

    searchLoading = false;
    render();
  }

  async function recheckHistoryItem(historyId) {
    const h = suggestionHistory.find(x => x.historyId === historyId);
    if (!h || !h.id) return;
    searchQuery = h.name || '';
    await selectSearchItem(h.id);

    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  async function analyzeTopTrends() {
    if (!liveItems.length) return;
    trendLoading = true;
    render();

    const budget = Number(liveBudget) || 0;
    const preliminary = liveItems
      .map(it => scoreLiveItem(it, budget))
      .filter(Boolean)
      .filter(s => s.confidence !== 'low' && s.volumeRatio >= 0.5 && s.age <= 60 * 60)
      .sort((a, b) => b.ranking - a.ranking)
      .slice(0, 24);

    await Promise.all(preliminary.map(s => fetchTrendForItem(s.id)));
    trendLoading = false;
    computeLiveResults();
    render();
  }

  function buildRefreshSnapshot(it, budget) {
    const normal = scoreLiveItem(it, budget);
    if (normal) return withTrend(normal);

    const net = it.sell - taxPerUnit(it.sell);
    const margin = net - it.buy;
    const pct = it.buy > 0 ? (margin / it.buy) * 100 : 0;
    const vol24 = volumeOf(it.day);
    const midpoint = (it.buy + it.sell) / 2;
    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const qty = Math.max(1, Math.min(Math.floor((Number(budget) || 0) / Math.max(it.buy, 1)), it.limit || 1));
    const cached = trendCache[String(it.id)];

    return {
      ...it, margin, pct, qty, potential: margin * qty, score: 0, confidence: 'low',
      vol24, tradedValue24: midpoint * vol24, requiredVol24,
      volumeRatio: requiredVol24 ? vol24 / requiredVol24 : 0,
      trend: cached ? cached.trend : null, refreshedOnly: true, ranking: -Infinity
    };
  }

  async function refreshPreviousSuggestion() {
    if (!lastSuggestion || lastSuggestion === 'none' || !lastSuggestion.id) return;
    const id = lastSuggestion.id;
    suggestionRefreshing = true;
    render();

    await fetchLiveData(false);
    await fetchTrendForItem(id, true);

    const it = liveItems.find(x => String(x.id) === String(id));
    if (it) {
      const refreshed = buildRefreshSnapshot(it, Number(budgetInput) || 0);
      refreshed.refreshedAt = Date.now();
      rememberSuggestion(refreshed, false);
    }
    suggestionRefreshing = false;
    render();
  }

  async function fetchLiveData(analyzeTrends = true) {
    liveLoading = true;
    liveError = null;
    render();

    try {
      const base = 'https://prices.runescape.wiki/api/v1/osrs';
      if (!mappingCache) {
        const mapRes = await fetch(base + '/mapping');
        if (!mapRes.ok) throw new Error('mapping request failed (' + mapRes.status + ')');
        mappingCache = await mapRes.json();
      }

      const [latestRes, fiveRes, hourRes, dayRes] = await Promise.all([
        fetch(base + '/latest'),
        fetch(base + '/5m'),
        fetch(base + '/1h'),
        fetch(base + '/24h')
      ]);

      if (!latestRes.ok) throw new Error('latest prices request failed (' + latestRes.status + ')');
      if (!fiveRes.ok) throw new Error('5-minute volume request failed (' + fiveRes.status + ')');
      if (!hourRes.ok) throw new Error('1-hour volume request failed (' + hourRes.status + ')');
      if (!dayRes.ok) throw new Error('24-hour volume request failed (' + dayRes.status + ')');

      const latestData = (await latestRes.json()).data || {};
      const fiveData = normalizeAggregate(await fiveRes.json());
      const hourData = normalizeAggregate(await hourRes.json());
      const dayData = normalizeAggregate(await dayRes.json());

      liveItems = mappingCache.map(m => {
        const p = latestData[String(m.id)];
        if (!p || !p.high || !p.low) return null;
        return {
          id: m.id,
          name: m.name,
          limit: m.limit || 0,
          buy: Number(p.low),
          sell: Number(p.high),
          lowTime: Number(p.lowTime) || 0,
          highTime: Number(p.highTime) || 0,
          five: fiveData[String(m.id)] || null,
          hour: hourData[String(m.id)] || null,
          day: dayData[String(m.id)] || null
        };
      }).filter(Boolean);

      liveFetchedAt = Date.now();
    } catch (e) {
      liveItems = [];
      liveError = 'Could not reach the live OSRS price/volume feeds (' +
        (e && e.message ? e.message : 'network error') +
        '). If the API is temporarily unavailable, try Fetch again.';
    }

    liveLoading = false;
    computeLiveResults();
    render();
    if (analyzeTrends && liveItems.length) await analyzeTopTrends();
  }

  function maxReasonableSpreadPct(price) {
    if (price < 20) return 60;
    if (price < 100) return 45;
    if (price < 1000) return 30;
    if (price < 10000) return 22;
    if (price < 100000) return 18;
    return 15;
  }

  function scoreLiveItem(it, budget) {
    if (it.buy <= 0 || it.sell <= 0 || it.buy > budget || !it.limit) return null;

    const net = it.sell - taxPerUnit(it.sell);
    const margin = net - it.buy;
    const pct = it.buy > 0 ? (margin / it.buy) * 100 : 0;
    if (margin <= 0 || pct <= 0) return null;

    const spreadCap = maxReasonableSpreadPct(it.buy);
    if (pct > spreadCap) return null;

    const vol5 = volumeOf(it.five);
    const vol1h = volumeOf(it.hour);
    const vol24 = volumeOf(it.day);
    const high24 = sideVolume(it.day, 'high');
    const low24 = sideVolume(it.day, 'low');

    const midpoint = (it.buy + it.sell) / 2;
    const tradedValue24 = midpoint * vol24;

    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const volumeRatio = vol24 / requiredVol24;

    const nowSec = Date.now() / 1000;
    const ageHigh = it.highTime ? nowSec - it.highTime : Infinity;
    const ageLow = it.lowTime ? nowSec - it.lowTime : Infinity;
    const age = Math.max(ageHigh, ageLow);

    const minSide = Math.max(1, Math.floor(requiredVol24 * 0.08));
    const twoSided = high24 >= minSide && low24 >= minSide;

    const hourBuy = it.hour && Number(it.hour.avgLowPrice);
    const hourSell = it.hour && Number(it.hour.avgHighPrice);
    let hourPct = null;
    if (hourBuy > 0 && hourSell > 0) {
      const hourMargin = (hourSell - taxPerUnit(hourSell)) - hourBuy;
      hourPct = (hourMargin / hourBuy) * 100;
    }

    if (hourPct !== null && hourPct > 0) {
      const spreadRatio = pct / hourPct;
      if (pct > 8 && spreadRatio > 3.5) return null;
    }

    let score = 0;
    if (age <= 5 * 60) score += 25;
    else if (age <= 15 * 60) score += 20;
    else if (age <= 30 * 60) score += 12;
    else if (age <= 60 * 60) score += 4;

    if (volumeRatio >= 3) score += 30;
    else if (volumeRatio >= 1.5) score += 26;
    else if (volumeRatio >= 1) score += 22;
    else if (volumeRatio >= 0.5) score += 10;

    const expectedHour = Math.max(1, requiredVol24 / 24);
    if (vol1h >= expectedHour) score += 18;
    else if (vol1h >= expectedHour * 0.4) score += 11;
    else if (vol1h > 0) score += 4;

    if (vol5 >= Math.max(1, expectedHour / 12)) score += 12;
    else if (vol5 > 0) score += 6;

    if (twoSided) score += 10;

    if (hourPct !== null && hourPct > 0) {
      const diff = Math.abs(pct - hourPct);
      if (diff <= Math.max(1.5, hourPct * 0.5)) score += 5;
    }

    score = Math.max(0, Math.min(100, score));
    const confidence = score >= 75 ? 'high' : score >= 55 ? 'medium' : 'low';

    const budgetQty = Math.floor(budget / it.buy);
    const marketQty = Math.max(1, Math.floor(vol24 * 0.03));
    const qty = Math.min(budgetQty, it.limit, marketQty);
    if (qty <= 0) return null;

    const potential = margin * qty;
    const confidenceMultiplier = 0.55 + (score / 100) * 0.45;
    const recentMultiplier = age <= 15 * 60 ? 1.0 : age <= 30 * 60 ? 0.9 : 0.75;
    const ranking = potential * confidenceMultiplier * recentMultiplier;

    return {
      ...it, margin, pct, qty, potential, ranking, score, confidence,
      vol5, vol1h, vol24, tradedValue24, requiredVol24, volumeRatio,
      age, hourPct, twoSided
    };
  }

  function computeLiveResults() {
    const budget = Number(liveBudget) || 0;
    const scored = liveItems
      .map(it => scoreLiveItem(it, budget))
      .filter(Boolean)
      .map(withTrend)
      .filter(s => {
        if (liveLiquidity === 'reliable') {
          return s.confidence === 'high' && s.volumeRatio >= 1 && s.twoSided && s.age <= 30 * 60;
        }
        return s.confidence !== 'low' && s.volumeRatio >= 0.5 && s.age <= 60 * 60;
      });

    scored.sort((a, b) => b.ranking - a.ranking);
    liveResults = scored.slice(0, 12);
  }

  function computeSuggestion() {
    if (!liveFetchedAt || !liveItems.length) return null;

    const budget = Number(budgetInput) || 0;
    let candidates = liveItems
      .map(it => scoreLiveItem(it, budget))
      .filter(Boolean)
      .map(withTrend);

    if (speedFilter === 'high') {
      candidates = candidates.filter(s =>
        s.confidence === 'high' && s.volumeRatio >= 1 && s.twoSided && s.age <= 30 * 60
      );
    } else if (speedFilter === 'medium') {
      candidates = candidates.filter(s =>
        (s.confidence === 'high' || s.confidence === 'medium') &&
        s.volumeRatio >= 0.5 && s.twoSided && s.age <= 60 * 60
      );
    }

    if (trendBias === 'rising') {
      candidates = candidates.filter(s =>
        s.trend && s.trend.direction === 'rising' &&
        (s.trend.ret7d === null || s.trend.ret7d > 0)
      );
    } else if (trendBias === 'avoid-falling') {
      candidates = candidates.filter(s => !s.trend || s.trend.direction !== 'falling');
    }

    if (!candidates.length) return null;
    candidates.sort((a, b) => b.ranking - a.ranking);
    return candidates[0];
  }

        <div class="panel">
          <div class="panel-head">
            <h2>Momentum & Update Watch</h2>
            <div class="hint">Historical price direction + places to check update-driven market reactions</div>
          </div>
          ${renderMomentumWatch()}
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Flip Log</h2>
            <div class="tax-row">
              GE tax
              <input type="number" id="taxInput" min="0" max="20" step="0.5" value="${taxRate}">
              % · capped at 5M/item
            </div>
          </div>
          <div class="add-form log-form" id="logForm">
            <div class="field"><label>Item</label><input id="lName" placeholder="Item name"></div>
            <div class="field"><label>Qty</label><input id="lQty" type="number" placeholder="1"></div>
            <div class="field"><label>Bought at</label><input id="lBuy" type="number" placeholder="0"></div>
            <div class="field"><label>Sold at</label><input id="lSell" type="number" placeholder="0"></div>
            <button class="btn" id="lAddBtn">Log flip</button>
          </div>
          ${fliplog.length ? `
          <table>
            <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Buy</th><th class="num">Sell</th><th class="num">Profit</th><th></th></tr></thead>
            <tbody>
              ${[...fliplog].reverse().map(f => `
                <tr>
                  <td class="name">${escapeHtml(f.name)}</td>
                  <td class="num">${f.qty}</td>
                  <td class="num">${fmt(f.buy)}</td>
                  <td class="num">${fmt(f.sell)}</td>
                  <td class="num ${f.profit >= 0 ? 'pos' : 'neg'}">${f.profit >= 0 ? '+' : ''}${fmt(f.profit)}</td>
                  <td><button class="del-btn" data-del-log="${f.id}">Remove</button></td>
                </tr>`).join('')}
            </tbody>
          </table>` : `<div class="empty">No flips logged yet. Your first sale will appear here.</div>`}
        </div>
      </div>
    `;

    wireEvents();
  }

  function renderLiveResults() {
    if (liveError) {
      return `<div class="empty">${escapeHtml(liveError)}</div>`;
    }
    if (liveLoading) {
      return `<div class="empty">Pulling current Grand Exchange prices and market activity…</div>`;
    }
    if (!liveFetchedAt) {
      return `<div class="empty">Set a budget and hit Fetch Live Prices. The finder will reject stale, thin, and suspiciously wide spreads before ranking candidates.</div>`;
    }
    if (!liveResults.length) {
      return `<div class="empty">No candidates passed the current quality filters as of ${new Date(liveFetchedAt).toLocaleTimeString()}. Try "Broader" or a larger budget.</div>`;
    }
    return `
      ${trendLoading ? '<div class="positive-note">Live prices are loaded. Now checking 6-hour historical price data for the strongest candidates so the tool can avoid obvious downtrends…</div>' : ''}
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Item</th><th class="num">Buy</th><th class="num">Sell</th><th class="num">Margin</th>
          <th class="num">%</th><th>Trend</th><th class="num">7d</th><th class="num">24h Vol</th><th class="num">24h GP</th>
          <th>Confidence</th><th class="num">GE Limit</th><th class="num">Qty</th><th class="num">Est. Profit</th><th></th>
        </tr></thead>
        <tbody>
          ${liveResults.map((r, idx) => `
            <tr class="${idx === 0 ? 'top-flip' : ''}">
              <td class="name">${idx === 0 ? '<span class="crown">★</span>' : ''}${escapeHtml(r.name)}</td>
              <td class="num">${fmt(r.buy)}</td>
              <td class="num">${fmt(r.sell)}</td>
              <td class="num pos">+${fmt(r.margin)}</td>
              <td class="num pos">+${r.pct.toFixed(1)}%</td>
              <td>${trendLabel(r.trend)}</td>
              <td class="num ${r.trend && (r.trend.ret7d ?? 0) < 0 ? 'neg' : 'pos'}">${r.trend ? fmtPct(r.trend.ret7d) : '—'}</td>
              <td class="num">${fmt(r.vol24)}</td>
              <td class="num">${fmt(r.tradedValue24)}</td>
              <td><span class="confidence ${r.confidence}">${r.confidence}</span></td>
              <td class="num">${fmt(r.limit)} / 4h</td>
              <td class="num">${r.qty}</td>
              <td class="num pos">+${fmt(r.potential)}</td>
              <td><button class="del-btn" data-use-live="${r.id}">Use</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <div class="market-note">
        <b>Trend-aware ranking:</b> after the normal liquidity/spread checks, the strongest candidates get a
        6-hour historical scan. Rising multi-day trends receive a modest ranking boost; established downtrends
        are heavily penalized. The Suggest panel defaults to <b>Rising</b>, so it will not deliberately recommend
        an item whose recent multi-day direction is classified as falling.
      </div>
      <div class="s-note">Prices refreshed ${new Date(liveFetchedAt).toLocaleTimeString()}. Suggested Qty is capped by your budget, the GE buy limit, and roughly 3% of observed 24h market volume.</div>
    `;
  }

  function renderSuggestion() {
    if (lastSuggestion === 'none') {
      if (!liveFetchedAt) {
        return `<div class="empty">Fetch live prices first, then Suggest will choose from the validated live candidates.</div>`;
      }
      return `<div class="empty">No candidate currently fits that budget, confidence, and trend filter. "Rising" is intentionally strict — try "No ↓" if you want to include flat/mixed markets.</div>`;
    }
    if (!lastSuggestion) {
      return `<div class="empty">Fetch live prices, set your budget, then hit Suggest. Trend analysis is used automatically for the strongest candidates.</div>`;
    }

    const s = lastSuggestion;
    const t = s.trend || null;
    const isBadNow = s.refreshedOnly || s.margin <= 0;
    return `
      <div class="suggestion-card">
        <div class="s-item">
          <span class="crown">★</span>${escapeHtml(s.name)}
          <span class="confidence ${s.confidence || 'low'}">${s.confidence || 'low'}</span>
          ${trendLabel(t)}
        </div>
        <div class="suggestion-grid">
          <div class="s-stat"><div class="s-label">Buy at</div><div class="s-value">${fmt(s.buy)} gp</div></div>
          <div class="s-stat"><div class="s-label">Sell at</div><div class="s-value">${fmt(s.sell)} gp</div></div>
          <div class="s-stat"><div class="s-label">GE limit / 4h</div><div class="s-value">${fmt(s.limit)}</div></div>
          <div class="s-stat"><div class="s-label">Suggested qty</div><div class="s-value">${fmt(s.qty)}</div></div>
        </div>
        <div class="suggestion-grid">
          <div class="s-stat"><div class="s-label">After-tax ROI</div><div class="s-value ${s.pct >= 0 ? 'pos' : 'neg'}">${fmtPct(s.pct)}</div></div>
          <div class="s-stat"><div class="s-label">1-day trend</div><div class="s-value">${t ? fmtPct(t.ret1d) : '—'}</div></div>
          <div class="s-stat"><div class="s-label">3-day trend</div><div class="s-value">${t ? fmtPct(t.ret3d) : '—'}</div></div>
          <div class="s-stat"><div class="s-label">7-day trend</div><div class="s-value">${t ? fmtPct(t.ret7d) : '—'}</div></div>
        </div>
        ${isBadNow ? `<div class="warning-note"><b>Re-check warning:</b> this saved flip no longer passes the normal recommendation filters at its current prices. That does not automatically mean you should panic-sell; it means the original margin/liquidity setup has changed and should be reassessed.</div>` : ''}
        ${t && t.catalyst ? `<div class="positive-note"><b>Momentum flag:</b> this item has moved strongly enough recently to look catalyst-sensitive. That can be good for demand, but it can also mean more volatility than an ordinary flip.</div>` : ''}
        <div class="market-note"><b>Current observed market:</b> low ${fmt(s.buy)} gp · high ${fmt(s.sell)} gp · after-tax full-spread margin ${s.margin >= 0 ? '+' : ''}${fmt(s.margin)} gp each.</div>
        ${renderTradeTargets(s)}
        <div class="s-note">
          Uses ${fmt((s.qty || 0) * (s.buy || 0))} gp of your ${fmt(Number(budgetInput) || 0)} gp budget.
          ${s.refreshedAt ? `Last re-checked ${new Date(s.refreshedAt).toLocaleTimeString()}. ` : ''}
          Historical direction is a risk filter, not a guarantee that price will keep moving the same way.
        </div>
        <div class="suggest-actions">
          <button class="btn secondary" id="refreshSuggestionBtn" ${suggestionRefreshing ? 'disabled' : ''}>${suggestionRefreshing ? 'Refreshing…' : 'Refresh This Flip'}</button>
          <button class="btn secondary" id="useSuggestionBtn">Use in Flip Log</button>
        </div>
      </div>
    `;
  }

  function renderItemSearch() {
    const filteredHistory = suggestionHistory
      .filter(h => !searchQuery.trim() || (h.name || '').toLowerCase().includes(searchQuery.trim().toLowerCase()))
      .slice(0, 12);

    let selectedHtml = '';
    if (searchSelected) {
      const s = searchSelected;
      const t = s.trend || null;
      selectedHtml = `
        <div class="detail-card">
          <div class="detail-title">
            ${escapeHtml(s.name)}
            <span class="limit-pill">GE limit ${fmt(s.limit)} / 4h</span>
            ${trendLabel(t)}
          </div>
          <div class="suggestion-grid">
            <div class="s-stat"><div class="s-label">Current low</div><div class="s-value">${fmt(s.buy)} gp</div></div>
            <div class="s-stat"><div class="s-label">Current high</div><div class="s-value">${fmt(s.sell)} gp</div></div>
            <div class="s-stat"><div class="s-label">24h volume</div><div class="s-value">${fmt(s.vol24)}</div></div>
            <div class="s-stat"><div class="s-label">Suggested qty</div><div class="s-value">${fmt(s.qty)}</div></div>
          </div>
          <div class="suggestion-grid">
            <div class="s-stat"><div class="s-label">1-day trend</div><div class="s-value">${t ? fmtPct(t.ret1d) : '—'}</div></div>
            <div class="s-stat"><div class="s-label">3-day trend</div><div class="s-value">${t ? fmtPct(t.ret3d) : '—'}</div></div>
            <div class="s-stat"><div class="s-label">7-day trend</div><div class="s-value">${t ? fmtPct(t.ret7d) : '—'}</div></div>
            <div class="s-stat"><div class="s-label">Confidence</div><div class="s-value"><span class="confidence ${s.confidence || 'low'}">${s.confidence || 'low'}</span></div></div>
          </div>
          ${renderTradeTargets(s)}
        </div>`;
    }

    return `
      <div class="search-controls">
        <div class="field">
          <label>Search Grand Exchange items</label>
          <input id="itemSearchInput" value="${escapeAttr(searchQuery)}" placeholder="Granite hammer, zenyte shard, abyssal dagger…">
        </div>
        <button class="btn" id="itemSearchBtn" ${searchLoading ? 'disabled' : ''}>${searchLoading ? 'Loading…' : 'Search'}</button>
      </div>

      ${searchMatches.length ? `
        <div class="search-results">
          ${searchMatches.map(it => `
            <div class="search-hit">
              <div>
                <div>${escapeHtml(it.name)}</div>
                <div class="meta">Current low ${fmt(it.buy)} · high ${fmt(it.sell)} · GE limit ${fmt(it.limit)} / 4h</div>
              </div>
              <button class="mini-btn" data-search-item="${it.id}">View</button>
            </div>`).join('')}
        </div>` : (searchQuery.trim() && !searchLoading ? `<div class="empty" style="padding:10px">No matching actively traded items loaded for “${escapeHtml(searchQuery)}”.</div>` : '')}

      ${selectedHtml}

      <div class="history-title">Past Ledger suggestions</div>
      ${filteredHistory.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>Suggested</th><th class="num">Buy then</th><th class="num">Sell then</th><th class="num">GE Limit</th><th>Trend then</th><th></th></tr></thead>
            <tbody>
              ${filteredHistory.map(h => `
                <tr>
                  <td class="name">${escapeHtml(h.name || 'Unknown')}</td>
                  <td>${h.suggestedAt ? new Date(h.suggestedAt).toLocaleString() : '—'}</td>
                  <td class="num">${fmt(h.buy)}</td>
                  <td class="num">${fmt(h.sell)}</td>
                  <td class="num">${fmt(h.limit)} / 4h</td>
                  <td>${trendLabel(h.trend || null)}</td>
                  <td><button class="mini-btn" data-history-recheck="${escapeHtml(h.historyId || '')}">Re-check</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : `<div class="empty" style="padding:12px">No saved suggestions match this search yet. New V6 suggestions will be kept here automatically.</div>`}

      <div class="s-note">Suggestion history is stored in this browser using localStorage. It will survive normal refreshes, but it is not yet synced between your iPhone and computer.</div>
    `;
  }

  function renderMomentumWatch() {
    if (!liveFetchedAt) {
      return `<div class="empty">Fetch live prices first. After the trend scan, this section will highlight the strongest rising/catalyst-like candidates.</div>
        <div class="catalyst-links">
          <a class="link-btn" href="https://07.gg/ge/reports" target="_blank" rel="noopener">Update Market Reports</a>
          <a class="link-btn" href="https://www.oldschool.runescape.com/" target="_blank" rel="noopener">Official OSRS News</a>
          <a class="link-btn" href="https://oldschool.runescape.wiki/w/Upcoming_updates" target="_blank" rel="noopener">Upcoming Updates</a>
        </div>`;
    }

    const momentum = liveResults
      .filter(r => r.trend && r.trend.direction === 'rising')
      .sort((a, b) => (b.trend.score || 0) - (a.trend.score || 0))
      .slice(0, 8);

    return `
      ${momentum.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Trend</th><th class="num">1d</th><th class="num">3d</th><th class="num">7d</th><th class="num">24h Vol</th><th>Signal</th></tr></thead>
          <tbody>
            ${momentum.map(r => `
              <tr>
                <td class="name">${escapeHtml(r.name)}</td>
                <td>${trendLabel(r.trend)}</td>
                <td class="num ${r.trend.ret1d < 0 ? 'neg' : 'pos'}">${fmtPct(r.trend.ret1d)}</td>
                <td class="num ${r.trend.ret3d < 0 ? 'neg' : 'pos'}">${fmtPct(r.trend.ret3d)}</td>
                <td class="num ${r.trend.ret7d < 0 ? 'neg' : 'pos'}">${fmtPct(r.trend.ret7d)}</td>
                <td class="num">${fmt(r.vol24)}</td>
                <td>${r.trend.catalyst ? '<span class="tag fast">Momentum spike</span>' : '<span class="tag slow">Steady rise</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty">No strong rising candidates are in the current top results yet.</div>`}
      <div class="market-note">
        <b>About update-driven items:</b> this local tool can detect the <i>market footprint</i> of a catalyst
        — rising price plus active volume — but it cannot reliably understand a newspost well enough to infer every
        indirect beneficiary. For that, the Market Reports link is useful because it tracks GE reactions after OSRS
        newsposts. Future-update speculation should be treated separately from ordinary flipping because the reversal
        risk after release can be much higher.
      </div>
      <div class="catalyst-links">
        <a class="link-btn" href="https://07.gg/ge/reports" target="_blank" rel="noopener">Update Market Reports</a>
        <a class="link-btn" href="https://www.oldschool.runescape.com/" target="_blank" rel="noopener">Official OSRS News</a>
        <a class="link-btn" href="https://oldschool.runescape.wiki/w/Upcoming_updates" target="_blank" rel="noopener">Upcoming Updates</a>
      </div>
    `;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function wireEvents() {
    const liveBudgetEl = root.querySelector('#liveBudgetInput');
    if (liveBudgetEl) {
      liveBudgetEl.addEventListener('change', (e) => {
        const v = parseFloat(e.target.value);
        liveBudget = isNaN(v) ? 0 : v;
        budgetInput = liveBudget;
        computeLiveResults();
        render();
      });
    }

    root.querySelectorAll('[data-live-liq]').forEach(btn => {
      btn.addEventListener('click', () => {
        liveLiquidity = btn.getAttribute('data-live-liq');
        computeLiveResults();
        render();
      });
    });

    const liveFetchBtn = root.querySelector('#liveFetchBtn');
    if (liveFetchBtn) {
      liveFetchBtn.addEventListener('click', () => { fetchLiveData(); });
    }

    root.querySelectorAll('[data-use-live]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-use-live');
        const r = liveResults.find(x => String(x.id) === String(id));
        if (!r) return;
        const lName = root.querySelector('#lName');
        const lQty = root.querySelector('#lQty');
        const lBuy = root.querySelector('#lBuy');
        const lSell = root.querySelector('#lSell');
        if (lName) lName.value = r.name;
        if (lQty) lQty.value = r.qty;
        if (lBuy) lBuy.value = r.buy;
        if (lSell) lSell.value = r.sell;
        if (lName) lName.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    const budgetEl = root.querySelector('#budgetInput');
    if (budgetEl) {
      budgetEl.addEventListener('change', async (e) => {
        const v = parseFloat(e.target.value);
        budgetInput = isNaN(v) ? 0 : v;
        liveBudget = budgetInput;
        computeLiveResults();
        lastSuggestion = null;
        await saveSettings();
      });
    }

    root.querySelectorAll('[data-speed]').forEach(btn => {
      btn.addEventListener('click', () => {
        speedFilter = btn.getAttribute('data-speed');
        render();
      });
    });

    root.querySelectorAll('[data-trend-bias]').forEach(btn => {
      btn.addEventListener('click', () => {
        trendBias = btn.getAttribute('data-trend-bias');
        render();
      });
    });

    const itemSearchInput = root.querySelector('#itemSearchInput');
    if (itemSearchInput) {
      itemSearchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
      });
      itemSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchItems();
      });
    }

    const itemSearchBtn = root.querySelector('#itemSearchBtn');
    if (itemSearchBtn) {
      itemSearchBtn.addEventListener('click', () => { searchItems(); });
    }

    root.querySelectorAll('[data-search-item]').forEach(btn => {
      btn.addEventListener('click', () => { selectSearchItem(btn.getAttribute('data-search-item')); });
    });

    root.querySelectorAll('[data-history-recheck]').forEach(btn => {
      btn.addEventListener('click', () => { recheckHistoryItem(btn.getAttribute('data-history-recheck')); });
    });

    const suggestBtn = root.querySelector('#suggestBtn');
    if (suggestBtn) {
      suggestBtn.addEventListener('click', () => {
        const result = computeSuggestion();
        if (result) {
          result.suggestedAt = Date.now();
          rememberSuggestion(result);
        } else {
          lastSuggestion = 'none';
        }
        render();
      });
    }

    const refreshSuggestionBtn = root.querySelector('#refreshSuggestionBtn');
    if (refreshSuggestionBtn) {
      refreshSuggestionBtn.addEventListener('click', () => { refreshPreviousSuggestion(); });
    }

    const useSuggestionBtn = root.querySelector('#useSuggestionBtn');
    if (useSuggestionBtn && lastSuggestion && lastSuggestion !== 'none') {
      useSuggestionBtn.addEventListener('click', () => {
        const s = lastSuggestion;
        const targets = tradeTargets(s);
        const preferred = targets ? targets.normal : null;
        const lName = root.querySelector('#lName');
        const lQty = root.querySelector('#lQty');
        const lBuy = root.querySelector('#lBuy');
        const lSell = root.querySelector('#lSell');
        if (lName) lName.value = s.name || '';
        if (lQty) lQty.value = s.qty || 1;
        if (lBuy) lBuy.value = preferred ? preferred.buy : (s.buy || '');
        if (lSell) lSell.value = preferred ? preferred.sell : (s.sell || '');
        if (lName) lName.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    const taxInput = root.querySelector('#taxInput');
    if (taxInput) {
      taxInput.addEventListener('change', async (e) => {
        const v = parseFloat(e.target.value);
        taxRate = isNaN(v) ? 0 : v;
        await saveSettings();
        render();
      });
    }


    const lAddBtn = root.querySelector('#lAddBtn');
    if (lAddBtn) {
      lAddBtn.addEventListener('click', async () => {
        const name = root.querySelector('#lName').value.trim();
        const qty = parseFloat(root.querySelector('#lQty').value) || 1;
        const buy = parseFloat(root.querySelector('#lBuy').value);
        const sell = parseFloat(root.querySelector('#lSell').value);
        if (!name || isNaN(buy) || isNaN(sell)) return;
        const netSell = sell - taxPerUnit(sell);
        const profit = qty * (netSell - buy);
        fliplog.push({ id: 'l' + Date.now() + Math.random().toString(36).slice(2, 6), name, qty, buy, sell, profit });
        await saveLog();
        render();
        const badge = root.querySelector('#profitBadge');
        if (badge) { badge.classList.add('pulse'); setTimeout(() => badge.classList.remove('pulse'), 500); }
      });
    }

    root.querySelectorAll('[data-del-log]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-del-log');
        fliplog = fliplog.filter(f => f.id !== id);
        await saveLog();
        render();
      });
    });
  }

  loadAll();
})();
</script>
</div>
