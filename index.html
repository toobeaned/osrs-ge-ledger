<div id="ledger-root">
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-mark">⟡</div>
    <div class="loading-text">Unrolling the ledger…</div>
  </div>
</div>

<style>
  #ledger-root {
    --ink: #14110d;
    --panel: #211c16;
    --panel-raised: #29231b;
    --parchment: #f0e1bd;
    --parchment-dim: #c8b991;
    --gold: #d7a94a;
    --gold-bright: #ffd36a;
    --moss: #94d47f;
    --moss-dim: #6b9a5d;
    --ochre: #e2775e;
    --ochre-dim: #a95442;
    --line: #66583f;

    all: initial;
    * { box-sizing: border-box; }
    display: block;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    background: var(--ink);
    color: var(--parchment);
    min-height: 100vh;
    padding: 28px 16px 60px;
    background-image:
      radial-gradient(ellipse at top, rgba(199,154,60,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }

  #ledger-root .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 14px; color: var(--parchment-dim);
  }
  #ledger-root .loading-mark { font-size: 32px; color: var(--gold); animation: spin 1.4s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #ledger-root .wrap { max-width: 960px; margin: 0 auto; }

  #ledger-root .masthead { text-align: center; margin-bottom: 30px; position: relative; }
  #ledger-root .masthead h1 {
    font-family: 'Cinzel', 'Iowan Old Style', Georgia, serif;
    font-size: 30px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-bright); margin: 0 0 4px;
    text-shadow: 0 0 18px rgba(232,187,82,0.25);
  }
  #ledger-root .masthead .sub {
    font-size: 13px; letter-spacing: 1.5px; color: var(--parchment-dim); text-transform: uppercase;
  }
  #ledger-root .masthead .rule {
    width: 140px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 14px auto 0;
  }

  #ledger-root .badge {
    width: 168px; height: 168px; border-radius: 50%; margin: 22px auto 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 6px var(--ink), 0 0 0 7px var(--line), inset 0 0 24px rgba(199,154,60,0.12);
    background: radial-gradient(circle at 35% 30%, #2c2419, #1a1610);
    position: relative; transition: transform 0.25s ease;
  }
  #ledger-root .badge.pulse { animation: stamp 0.5s ease; }
  @keyframes stamp { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
  #ledger-root .badge .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--parchment-dim); }
  #ledger-root .badge .amount { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 22px; font-weight: 700; margin-top: 4px; }
  #ledger-root .badge .amount.pos { color: var(--moss); }
  #ledger-root .badge .amount.neg { color: var(--ochre); }
  #ledger-root .badge .flips { font-size: 10px; color: var(--parchment-dim); margin-top: 6px; letter-spacing: 1px; }

  #ledger-root .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    margin-top: 26px; padding: 20px 20px 22px;
  }
  #ledger-root .panel.suggest-panel { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(199,154,60,0.15), inset 0 0 30px rgba(199,154,60,0.04); }
  #ledger-root .panel.live-panel {
    background: #30291f;
    box-shadow:
      0 0 0 1px rgba(215,169,74,0.20),
      inset 0 0 34px rgba(255,211,106,0.045);
  }
  #ledger-root .live-panel tbody tr {
    background: rgba(20,17,13,0.12);
  }
  #ledger-root .live-panel tbody tr:nth-child(even) {
    background: rgba(255,255,255,0.018);
  }
  #ledger-root .live-panel tbody tr.top-flip {
    background: rgba(215,169,74,0.12);
  }
  #ledger-root .live-panel tbody tr:hover {
    background: rgba(255,255,255,0.055);
  }
  #ledger-root .panel-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  #ledger-root .panel-head h2 {
    font-family: 'Cinzel', Georgia, serif; font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold); margin: 0;
  }
  #ledger-root .panel-head .hint { font-size: 12px; color: var(--parchment-dim); font-style: italic; }

  #ledger-root .tax-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--parchment-dim); }
  #ledger-root .tax-row input[type=number] {
    width: 52px; background: var(--panel-raised); border: 1px solid var(--line); color: var(--parchment);
    padding: 3px 6px; border-radius: 2px; font-family: inherit; font-size: 12px;
  }

  /* Suggest panel controls */
  #ledger-root .suggest-controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 16px; }
  #ledger-root .speed-toggle { display: flex; gap: 6px; }
  #ledger-root .speed-btn {
    flex: 1; background: var(--panel-raised); border: 1px solid var(--line); color: var(--parchment-dim);
    padding: 8px 10px; border-radius: 2px; font-family: 'Cinzel', Georgia, serif; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-align: center;
  }
  #ledger-root .speed-btn.active { border-color: var(--gold); color: var(--gold-bright); background: rgba(199,154,60,0.08); }

  #ledger-root .suggestion-card {
    border: 1px dashed var(--gold); border-radius: 3px; padding: 16px 18px; margin-top: 4px;
    background: rgba(199,154,60,0.04);
  }
  #ledger-root .suggestion-card .s-item {
    font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: var(--gold-bright); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  #ledger-root .suggestion-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px;
  }
  #ledger-root .s-stat { display: flex; flex-direction: column; gap: 2px; }
  #ledger-root .s-stat .s-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--parchment-dim); }
  #ledger-root .s-stat .s-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; }
  #ledger-root .s-note { font-size: 12px; color: var(--parchment-dim); font-style: italic; margin-top: 8px; }

  #ledger-root .add-form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 16px; }
  #ledger-root .add-form.log-form { grid-template-columns: 2fr 0.8fr 1fr 1fr auto; }
  #ledger-root .field { display: flex; flex-direction: column; gap: 4px; }
  #ledger-root .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--parchment-dim); }
  #ledger-root .field input, #ledger-root .field select {
    background: var(--panel-raised); border: 1px solid var(--line); color: var(--parchment);
    padding: 8px 9px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  #ledger-root .field input:focus, #ledger-root .field select:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
  #ledger-root .field input::placeholder { color: #9b8d71; }

  #ledger-root .btn {
    background: var(--gold); color: var(--ink); border: none; border-radius: 2px;
    padding: 0 18px; font-family: 'Cinzel', Georgia, serif; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; align-self: end; height: 37px; font-weight: 700;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #ledger-root .btn:hover { background: var(--gold-bright); }
  #ledger-root .btn:active { transform: scale(0.97); }
  #ledger-root .btn:focus-visible { outline: 2px solid var(--parchment); outline-offset: 2px; }
  #ledger-root .btn.btn-wide { width: 100%; }

  #ledger-root table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #ledger-root thead th {
    text-align: left; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--parchment-dim); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  #ledger-root tbody td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(102,88,63,0.58);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--parchment);
  }
  #ledger-root tbody tr.top-flip { background: rgba(199,154,60,0.06); }
  #ledger-root tbody tr:hover { background: rgba(255,255,255,0.02); }
  #ledger-root td.name {
    font-family: 'Iowan Old Style', Georgia, serif;
    font-size: 14px;
    color: var(--parchment);
  }
  #ledger-root td.num { color: var(--parchment); }
  #ledger-root td.num { text-align: right; }
  #ledger-root .pos { color: var(--moss); }
  #ledger-root .neg { color: var(--ochre); }
  #ledger-root .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); letter-spacing: 0.5px; text-transform: uppercase; }
  #ledger-root .tag.fast { color: var(--moss); border-color: var(--moss-dim); }
  #ledger-root .tag.slow { color: var(--gold-bright); border-color: var(--gold); }
  #ledger-root .del-btn {
    background: none; border: 1px solid var(--line); color: var(--parchment-dim);
    border-radius: 2px; padding: 3px 8px; cursor: pointer; font-size: 11px;
  }
  #ledger-root .del-btn:hover { border-color: var(--ochre); color: var(--ochre); }

  #ledger-root .empty { text-align: center; padding: 26px 10px; color: var(--parchment-dim); font-style: italic; font-size: 13px; }
  #ledger-root .crown { color: var(--gold-bright); margin-right: 5px; }
  #ledger-root .table-wrap { width: 100%; overflow-x: auto; }
  #ledger-root .market-note {
    margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--gold);
    background: rgba(215,169,74,0.07); color: var(--parchment); font-size: 12px; line-height: 1.45;
  }
  #ledger-root .confidence {
    display: inline-block; min-width: 58px; text-align: center; font-size: 10px; padding: 2px 7px;
    border-radius: 10px; text-transform: uppercase; letter-spacing: .6px; font-family: 'Cinzel', Georgia, serif;
  }
  #ledger-root .confidence.high { color: #b9f0a6; border: 1px solid #6b9a5d; background: rgba(107,154,93,.12); }
  #ledger-root .confidence.medium { color: #ffe08a; border: 1px solid #b28b3f; background: rgba(178,139,63,.12); }
  #ledger-root .confidence.low { color: #ef9b86; border: 1px solid #a95442; background: rgba(169,84,66,.12); }
  #ledger-root .muted { color: var(--parchment-dim); }
  #ledger-root .trend {
    display: inline-block; min-width: 72px; text-align: center; font-size: 10px; padding: 2px 7px;
    border-radius: 10px; text-transform: uppercase; letter-spacing: .55px; font-family: 'Cinzel', Georgia, serif;
  }
  #ledger-root .trend.rising { color: #b9f0a6; border: 1px solid #6b9a5d; background: rgba(107,154,93,.12); }
  #ledger-root .trend.mixed { color: #ffe08a; border: 1px solid #b28b3f; background: rgba(178,139,63,.12); }
  #ledger-root .trend.falling { color: #ef9b86; border: 1px solid #a95442; background: rgba(169,84,66,.12); }
  #ledger-root .trend.unknown { color: var(--parchment-dim); border: 1px solid var(--line); }
  #ledger-root .suggest-controls.four { grid-template-columns: 1fr 1fr 1fr auto; }
  #ledger-root .suggest-actions { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
  #ledger-root .btn.secondary {
    background: var(--panel-raised); color: var(--gold-bright); border: 1px solid var(--gold);
  }
  #ledger-root .btn.secondary:hover { background: rgba(215,169,74,.12); }
  #ledger-root .link-btn {
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    background: var(--panel-raised); color: var(--gold-bright); border: 1px solid var(--gold);
    border-radius: 2px; padding: 9px 12px; font-family: 'Cinzel', Georgia, serif;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
  }
  #ledger-root .link-btn:hover { background: rgba(215,169,74,.12); }
  #ledger-root .catalyst-links { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
  #ledger-root .warning-note {
    margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--ochre);
    background: rgba(226,119,94,.08); color: var(--parchment); font-size: 12px; line-height: 1.45;
  }
  #ledger-root .positive-note {
    margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--moss);
    background: rgba(148,212,127,.07); color: var(--parchment); font-size: 12px; line-height: 1.45;
  }

  #ledger-root .search-controls {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 14px;
  }
  #ledger-root .search-results {
    display: grid; gap: 7px; margin-top: 8px;
  }
  #ledger-root .search-hit {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 10px; border: 1px solid var(--line); background: rgba(255,255,255,.018);
  }
  #ledger-root .search-hit .meta { font-size: 11px; color: var(--parchment-dim); margin-top: 2px; }
  #ledger-root .mini-btn {
    background: var(--panel-raised); border: 1px solid var(--gold); color: var(--gold-bright);
    border-radius: 2px; padding: 5px 9px; cursor: pointer; font-family: 'Cinzel', Georgia, serif;
    font-size: 10px; letter-spacing: .7px; text-transform: uppercase; white-space: nowrap;
  }
  #ledger-root .mini-btn:hover { background: rgba(215,169,74,.12); }
  #ledger-root .detail-card {
    border: 1px solid var(--line); background: rgba(255,255,255,.018); padding: 14px; margin-top: 12px;
  }
  #ledger-root .detail-title {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--gold-bright);
    font-family: 'Cinzel', Georgia, serif; font-size: 17px; margin-bottom: 10px;
  }
  #ledger-root .horizon-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px;
  }
  #ledger-root .horizon-card {
    border: 1px solid var(--line); background: rgba(20,17,13,.24); padding: 12px;
  }
  #ledger-root .horizon-card.quick { border-color: var(--moss-dim); }
  #ledger-root .horizon-card.normal { border-color: var(--gold); }
  #ledger-root .horizon-card.patient { border-color: #7e6f55; }
  #ledger-root .horizon-name {
    font-family: 'Cinzel', Georgia, serif; text-transform: uppercase; letter-spacing: 1px;
    font-size: 11px; margin-bottom: 8px; color: var(--gold-bright);
  }
  #ledger-root .horizon-line {
    display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: 12px;
  }
  #ledger-root .horizon-line span:first-child { color: var(--parchment-dim); }
  #ledger-root .horizon-line strong { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  #ledger-root .history-title {
    font-family: 'Cinzel', Georgia, serif; font-size: 12px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--gold); margin: 18px 0 8px;
  }
  #ledger-root .limit-pill {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--parchment);
    border: 1px solid var(--line); border-radius: 10px; padding: 2px 7px; white-space: nowrap;
  }
  #ledger-root .section-sep { height: 1px; background: var(--line); margin: 14px 0; opacity: .7; }


  /* V7.1 responsive live finder + deterministic decision support */
  #ledger-root .flip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  #ledger-root .flip-card {
    min-width: 0; border: 1px solid var(--line); background: rgba(20,17,13,.22); padding: 13px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #ledger-root .flip-card.top-flip { border-color: var(--gold); background: rgba(215,169,74,.09); }
  #ledger-root .flip-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  #ledger-root .flip-card-title { min-width:0; font-family:'Cinzel', Georgia, serif; font-size:15px; color:var(--gold-bright); }
  #ledger-root .flip-card-tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #ledger-root .flip-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px 12px; }
  #ledger-root .flip-metric { min-width:0; }
  #ledger-root .flip-metric .k { font-size:9px; text-transform:uppercase; letter-spacing:.8px; color:var(--parchment-dim); }
  #ledger-root .flip-metric .v { margin-top:2px; font-family:'JetBrains Mono', monospace; font-size:12px; overflow-wrap:anywhere; }
  #ledger-root .flip-card-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid rgba(102,88,63,.5); padding-top:9px; }
  #ledger-root .horizon-choice { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  #ledger-root .horizon-choice .speed-btn { min-width:0; }
  #ledger-root .horizon-summary { font-size:11px; color:var(--parchment-dim); line-height:1.4; margin-top:5px; }
  #ledger-root .decision-box { margin-top:10px; border:1px solid var(--line); background:rgba(255,255,255,.018); padding:11px 12px; }
  #ledger-root .decision-line { font-size:12px; line-height:1.5; margin-top:5px; }
  #ledger-root .decision-line:first-child { margin-top:0; }
  #ledger-root .decision-line b { color:var(--gold-bright); }
  #ledger-root .update-context { margin-top:10px; padding:10px 12px; border-left:3px solid #7d9cc7; background:rgba(125,156,199,.08); font-size:12px; line-height:1.5; }
  #ledger-root .backup-tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  #ledger-root .backup-note { width:100%; font-size:11px; color:var(--parchment-dim); line-height:1.45; }
  #ledger-root .btn.compact { height:34px; padding:0 12px; font-size:10px; }
  #ledger-root .hidden-file { display:none !important; }
  #ledger-root .horizon-card.focused { box-shadow: inset 0 0 0 1px rgba(255,211,106,.25); background:rgba(215,169,74,.065); }

  #ledger-root .price-history-panel { margin-top:16px; border:1px solid var(--line); background:rgba(20,17,13,.20); padding:12px; }
  #ledger-root .history-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  #ledger-root .chart-range-row { display:flex; gap:5px; flex-wrap:wrap; }
  #ledger-root .chart-range-btn { background:var(--panel-raised); border:1px solid var(--line); color:var(--parchment-dim); padding:5px 9px; border-radius:2px; cursor:pointer; font-family:'JetBrains Mono', monospace; font-size:10px; }
  #ledger-root .chart-range-btn.active { border-color:var(--gold); color:var(--gold-bright); background:rgba(215,169,74,.10); }
  #ledger-root .price-chart-svg { width:100%; height:auto; min-height:180px; display:block; margin-top:5px; overflow:visible; }
  #ledger-root .chart-grid { stroke:rgba(200,185,145,.16); stroke-width:1; }
  #ledger-root .chart-high, #ledger-root .chart-low { fill:none; stroke-width:2.3; vector-effect:non-scaling-stroke; }
  #ledger-root .chart-high { stroke:var(--gold-bright); }
  #ledger-root .chart-low { stroke:var(--moss); }
  #ledger-root .chart-axis { fill:var(--parchment-dim); font-family:'JetBrains Mono', monospace; font-size:11px; }
  #ledger-root .chart-legend { display:flex; gap:15px; margin-top:8px; font-size:10px; color:var(--parchment-dim); }
  #ledger-root .chart-legend span { display:inline-flex; align-items:center; gap:5px; }
  #ledger-root .chart-legend i { width:18px; height:2px; display:inline-block; }
  #ledger-root .legend-high { background:var(--gold-bright); }
  #ledger-root .legend-low { background:var(--moss); }
  #ledger-root .exit-plan { margin-top:14px; padding:12px; border:1px solid var(--line); background:rgba(255,255,255,.018); }
  #ledger-root .exit-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px 16px; }
  #ledger-root .exit-grid > div { display:flex; flex-direction:column; gap:3px; }
  #ledger-root .exit-grid .wide { grid-column:1 / -1; }
  #ledger-root .exit-grid span { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--parchment-dim); }
  #ledger-root .exit-grid strong { font-size:12px; line-height:1.45; color:var(--parchment); font-weight:600; }

  @media (max-width: 760px) {
    #ledger-root .flip-grid { grid-template-columns: 1fr; }
    #ledger-root .flip-metrics { grid-template-columns: repeat(3,minmax(0,1fr)); }
  }

  @media (max-width: 640px) {
    #ledger-root .add-form, #ledger-root .add-form.log-form { grid-template-columns: 1fr 1fr; }
    #ledger-root .btn { grid-column: 1 / -1; }
    #ledger-root .suggest-controls, #ledger-root .suggest-controls.four { grid-template-columns: 1fr; }
    #ledger-root .suggestion-grid { grid-template-columns: 1fr 1fr; }
    #ledger-root .horizon-grid { grid-template-columns: 1fr; }
    #ledger-root .search-controls { grid-template-columns: 1fr; }
    #ledger-root .flip-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
    #ledger-root .horizon-choice { grid-template-columns: 1fr; }
    #ledger-root .exit-grid { grid-template-columns: 1fr; }
    #ledger-root .exit-grid .wide { grid-column: 1; }
    #ledger-root table { font-size: 11px; }
  }
</style>

<script>
(function() {
  const root = document.getElementById('ledger-root');

  let fliplog = [];
  let loaded = false;

  let budgetInput = 100000;
  let speedFilter = 'high';
  let tradeHorizon = null; // V7.1: user explicitly chooses Quick / Normal / Patient before Suggest.
  let lastSuggestion = null;
  let suggestionLoading = false;
  let suggestionChartRange = '1m';
  let searchChartRange = '1m';
  let priceHistoryCache = {};
  let chartLoading = { suggestion: false, search: false };

  let mappingCache = null;
  let liveItems = [];
  let liveResults = [];
  let liveLoading = false;
  let liveError = null;
  let liveFetchedAt = null;
  let liveBudget = 100000;
  let liveLiquidity = 'reliable';
  let trendBias = 'rising';
  let trendCache = {};
  let trendLoading = false;
  let suggestionRefreshing = false;
  let suggestionHistory = [];
  let searchQuery = '';
  let searchMatches = [];
  let searchSelected = null;
  let searchLoading = false;

  const STORAGE_KEYS = {
    fliplog: 'osrs_ge_ledger_fliplog',
    settings: 'osrs_ge_ledger_settings',
    suggestion: 'osrs_last_suggestion_v5',
    suggestionHistory: 'osrs_ge_ledger_suggestion_history_v6'
  };

  function readLocalJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('Could not read localStorage key:', key, e);
      return fallback;
    }
  }

  function writeLocalJson(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.warn('Could not write localStorage key:', key, e);
      return false;
    }
  }

  async function loadAll() {
    fliplog = readLocalJson(STORAGE_KEYS.fliplog, []);

    const parsed = readLocalJson(STORAGE_KEYS.settings, {});
    budgetInput = typeof parsed.budgetInput === 'number' ? parsed.budgetInput : 100000;

    liveBudget = budgetInput;
    lastSuggestion = readLocalJson(STORAGE_KEYS.suggestion, null);
    suggestionHistory = readLocalJson(STORAGE_KEYS.suggestionHistory, []);
    if (!Array.isArray(suggestionHistory)) suggestionHistory = [];

    loaded = true;
    render();
  }


  async function saveLog() {
    writeLocalJson(STORAGE_KEYS.fliplog, fliplog);
  }

  async function saveSettings() {
    writeLocalJson(STORAGE_KEYS.settings, { budgetInput });
  }

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(Math.round(n));
    return sign + abs.toLocaleString('en-US');
  }

  const GE_TAX_RATE = 0.02;
  const TAX_CAP = 5000000;

  // Recommendation math always uses the real GE tax. The Flip Log is separate:
  // its Sold At field is entered from GE history, where the user's received amount already reflects tax.
  function taxPerUnit(sellPrice) {
    return Math.min(Math.floor(Number(sellPrice || 0) * GE_TAX_RATE), TAX_CAP);
  }


  function totalProfit() { return fliplog.reduce((sum, f) => sum + f.profit, 0); }


  function downloadTextFile(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportLedgerBackup() {
    const payload = {
      ledger: 'The Exchange Ledger',
      schemaVersion: 7.1,
      exportedAt: new Date().toISOString(),
      fliplog,
      suggestionHistory,
      lastSuggestion: lastSuggestion && lastSuggestion !== 'none' ? lastSuggestion : null,
      settings: { budgetInput }
    };
    const day = new Date().toISOString().slice(0, 10);
    downloadTextFile('exchange-ledger-backup-' + day + '.json', JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  }

  function csvCell(v) {
    const str = v == null ? '' : String(v);
    return '"' + str.replace(/"/g, '""') + '"';
  }

  function exportFlipLogCsv() {
    const rows = [['Date', 'Item', 'Qty', 'Buy', 'Sell', 'Profit']];
    fliplog.forEach(f => rows.push([
      f.createdAt ? new Date(f.createdAt).toISOString() : '', f.name, f.qty, f.buy, f.sell, f.profit
    ]));
    const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
    const day = new Date().toISOString().slice(0, 10);
    downloadTextFile('exchange-ledger-flips-' + day + '.csv', csv, 'text/csv;charset=utf-8');
  }

  async function importLedgerBackup(file) {
    if (!file) return;
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch (e) {
      alert('That file is not a valid Ledger JSON backup.');
      return;
    }
    if (!data || (!Array.isArray(data.fliplog) && !Array.isArray(data.suggestionHistory))) {
      alert('That JSON file does not look like an Exchange Ledger backup.');
      return;
    }
    if (!confirm('Import this Ledger backup? Existing flips and suggestion history will be merged; matching IDs will not be duplicated.')) return;

    const byId = new Map(fliplog.map(f => [String(f.id), f]));
    (Array.isArray(data.fliplog) ? data.fliplog : []).forEach(f => {
      if (f && f.id != null && !byId.has(String(f.id))) byId.set(String(f.id), f);
    });
    fliplog = Array.from(byId.values());

    const histById = new Map(suggestionHistory.map(h => [String(h.historyId || h.id || ''), h]));
    (Array.isArray(data.suggestionHistory) ? data.suggestionHistory : []).forEach(h => {
      const key = String((h && (h.historyId || h.id)) || '');
      if (key && !histById.has(key)) histById.set(key, h);
    });
    suggestionHistory = Array.from(histById.values())
      .sort((a, b) => Number(b.suggestedAt || 0) - Number(a.suggestedAt || 0))
      .slice(0, 80);

    if (data.settings && typeof data.settings === 'object') {
      if (typeof data.settings.budgetInput === 'number') {
        budgetInput = data.settings.budgetInput;
        liveBudget = budgetInput;
      }
    }
    if (data.lastSuggestion && typeof data.lastSuggestion === 'object') lastSuggestion = data.lastSuggestion;

    await saveLog();
    await saveSettings();
    writeLocalJson(STORAGE_KEYS.suggestionHistory, suggestionHistory);
    if (lastSuggestion && lastSuggestion !== 'none') writeLocalJson(STORAGE_KEYS.suggestion, lastSuggestion);
    computeLiveResults();
    render();
    alert('Ledger backup imported. Existing data was preserved and new records were merged.');
  }

  function normalizeAggregate(json) {
    const raw = json && json.data ? json.data : {};
    const map = {};
    if (Array.isArray(raw)) {
      raw.forEach(row => { if (row && row.id !== undefined) map[String(row.id)] = row; });
    } else {
      Object.keys(raw || {}).forEach(id => { map[String(id)] = raw[id] || {}; });
    }
    return map;
  }

  function volumeOf(row) {
    if (!row) return 0;
    if (typeof row.volume === 'number') return row.volume;
    return (Number(row.highPriceVolume) || 0) + (Number(row.lowPriceVolume) || 0);
  }

  function sideVolume(row, side) {
    if (!row) return 0;
    const key = side === 'high' ? 'highPriceVolume' : 'lowPriceVolume';
    if (typeof row[key] === 'number') return row[key];
    const v = Number(row.volume) || 0;
    return Math.floor(v / 2);
  }


  function rememberSuggestion(s, addToHistory = true) {
    lastSuggestion = s;
    if (!s || s === 'none') return;
    writeLocalJson(STORAGE_KEYS.suggestion, s);

    if (addToHistory) {
      const now = Date.now();
      const entry = {
        ...s,
        historyId: 'h' + now + Math.random().toString(36).slice(2, 6),
        suggestedAt: s.suggestedAt || now
      };

      const newest = suggestionHistory[0];
      if (newest && String(newest.id) === String(entry.id) &&
          Math.abs(now - Number(newest.suggestedAt || 0)) < 5 * 60 * 1000) {
        entry.historyId = newest.historyId;
        suggestionHistory[0] = entry;
      } else {
        suggestionHistory.unshift(entry);
      }

      suggestionHistory = suggestionHistory.slice(0, 80);
      writeLocalJson(STORAGE_KEYS.suggestionHistory, suggestionHistory);
    }
  }

  function rowMid(row) {
    if (!row) return null;
    const hi = Number(row.avgHighPrice);
    const lo = Number(row.avgLowPrice);
    if (hi > 0 && lo > 0) return (hi + lo) / 2;
    if (hi > 0) return hi;
    if (lo > 0) return lo;
    return null;
  }

  function pctChange(current, previous) {
    if (!(current > 0) || !(previous > 0)) return null;
    return ((current - previous) / previous) * 100;
  }

  function pointAtOrBefore(points, targetTs) {
    let best = null;
    for (const p of points) {
      if (p.timestamp <= targetTs) best = p;
      else break;
    }
    return best;
  }

  function analyzeTrendSeries(rows) {
    const points = (Array.isArray(rows) ? rows : [])
      .map(r => ({ ...r, timestamp: Number(r.timestamp) || 0, mid: rowMid(r) }))
      .filter(r => r.timestamp > 0 && r.mid > 0)
      .sort((a, b) => a.timestamp - b.timestamp);

    if (points.length < 4) return null;

    const latest = points[points.length - 1];
    const oneDay = pointAtOrBefore(points, latest.timestamp - 24 * 3600);
    const threeDay = pointAtOrBefore(points, latest.timestamp - 3 * 24 * 3600);
    const sevenDay = pointAtOrBefore(points, latest.timestamp - 7 * 24 * 3600);

    const ret1d = pctChange(latest.mid, oneDay && oneDay.mid);
    const ret3d = pctChange(latest.mid, threeDay && threeDay.mid);
    const ret7d = pctChange(latest.mid, sevenDay && sevenDay.mid);

    let score = 50;
    if (ret1d !== null) score += Math.max(-14, Math.min(14, ret1d * 1.7));
    if (ret3d !== null) score += Math.max(-16, Math.min(16, ret3d * 1.1));
    if (ret7d !== null) score += Math.max(-20, Math.min(20, ret7d * 0.75));
    score = Math.max(0, Math.min(100, score));

    let direction = 'mixed';
    if ((ret7d ?? 0) > 1.0 && (ret3d ?? 0) > -1.5 && score >= 56) direction = 'rising';
    if ((ret7d ?? 0) < -2.0 && (ret3d ?? 0) < 0 && score < 48) direction = 'falling';

    // Strong short-term surge: flag unusually fast market movement without inferring a cause.
    const catalyst = (ret1d ?? 0) >= 4 || ((ret3d ?? 0) >= 7 && (ret7d ?? 0) >= 7);

    return { ret1d, ret3d, ret7d, score, direction, catalyst, latestMid: latest.mid };
  }

  async function fetchTrendForItem(id, force = false) {
    const key = String(id);
    const cached = trendCache[key];
    if (!force && cached && (Date.now() - cached.at) < 10 * 60 * 1000) return cached.trend;

    try {
      const url = 'https://prices.runescape.wiki/api/v1/osrs/timeseries?timestep=6h&id=' + encodeURIComponent(id);
      const res = await fetch(url);
      if (!res.ok) throw new Error('trend request failed');
      const json = await res.json();
      const trend = analyzeTrendSeries(json.data || []);
      trendCache[key] = { at: Date.now(), trend };
      return trend;
    } catch (e) {
      trendCache[key] = { at: Date.now(), trend: null };
      return null;
    }
  }

  function withTrend(scored) {
    if (!scored) return null;
    const cached = trendCache[String(scored.id)];
    const trend = cached ? cached.trend : null;
    if (!trend) return { ...scored, trend: null };

    const horizon = scored.horizon || 'normal';
    let mult = 1;
    if (horizon === 'quick') {
      if (trend.direction === 'rising') mult = 1.07;
      else if (trend.direction === 'falling') mult = 0.84;
      else if (trend.score >= 55) mult = 1.02;
      if ((trend.ret1d ?? 0) > 18 && (trend.ret7d ?? 0) < 5) mult *= 0.86;
    } else if (horizon === 'patient') {
      if (trend.direction === 'rising') mult = 1.28;
      else if (trend.direction === 'falling') mult = 0.42;
      else if (trend.score >= 55) mult = 1.08;
      if ((trend.ret1d ?? 0) > 14 && (trend.ret7d ?? 0) < 5) mult *= 0.68;
    } else {
      if (trend.direction === 'rising') mult = 1.18;
      else if (trend.direction === 'falling') mult = 0.62;
      else if (trend.score >= 55) mult = 1.04;
      if ((trend.ret1d ?? 0) > 20 && (trend.ret7d ?? 0) < 5) mult *= 0.8;
    }

    return { ...scored, trend, ranking: scored.ranking * mult };
  }

  function fmtPct(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  }

  function trendLabel(trend) {
    if (!trend) return '<span class="trend unknown">No trend</span>';
    const arrow = trend.direction === 'rising' ? '↑' : trend.direction === 'falling' ? '↓' : '↔';
    return `<span class="trend ${trend.direction}">${arrow} ${trend.direction}</span>`;
  }


  function avgPresent(values, fallback) {
    const clean = values.map(Number).filter(v => v > 0 && isFinite(v));
    return clean.length ? clean.reduce((a, b) => a + b, 0) / clean.length : fallback;
  }

  function clampPrice(v) {
    return Math.max(1, Math.round(Number(v) || 1));
  }

  function targetMath(buy, sell, qty) {
    buy = clampPrice(buy);
    sell = clampPrice(sell);
    const tax = taxPerUnit(sell);
    const margin = sell - tax - buy;
    const pct = buy > 0 ? margin / buy * 100 : 0;
    return {
      buy, sell, tax, margin, pct,
      profit: margin * Math.max(1, Number(qty) || 1)
    };
  }

  function horizonTitle(horizon) {
    if (horizon === 'quick') return 'Quick · under 10 min';
    if (horizon === 'patient') return 'Patient · hours / overnight';
    return 'Normal · 1–3 hr';
  }

  function horizonSubtitle(horizon) {
    if (horizon === 'quick') return 'Prioritizes recent two-sided flow and capital turnover; accepts less spread for fill odds.';
    if (horizon === 'patient') return 'Prioritizes durable liquidity and multi-day trend; demands more compensation for holding risk.';
    return 'Balances recent liquidity, spread quality, trend, and capital efficiency.';
  }

  function twoSideFlow(row) {
    if (!row) return 0;
    return Math.min(sideVolume(row, 'high'), sideVolume(row, 'low'));
  }

  function horizonMarketQty(it, horizon) {
    const v5 = volumeOf(it.five);
    const v1 = volumeOf(it.hour);
    const v24 = volumeOf(it.day);
    const side5 = twoSideFlow(it.five);
    const side1 = twoSideFlow(it.hour);
    const side24 = twoSideFlow(it.day);

    if (horizon === 'quick') {
      const flow = side5 > 0 ? side5 : Math.floor(v5 / 2);
      return Math.max(1, Math.floor(flow * 0.20));
    }
    if (horizon === 'patient') {
      const flow = side24 > 0 ? side24 : Math.floor(v24 / 2);
      return Math.max(1, Math.floor(flow * 0.03));
    }
    const flow = side1 > 0 ? side1 : Math.floor(v1 / 2);
    return Math.max(1, Math.floor(flow * 0.10));
  }

  function quantityForHorizon(it, budget, horizon) {
    const budgetQty = Math.max(0, Math.floor((Number(budget) || 0) / Math.max(Number(it.buy) || 1, 1)));
    const limit = Math.max(0, Number(it.limit) || 0);
    const marketQty = horizonMarketQty(it, horizon);
    return Math.max(0, Math.min(budgetQty, limit || budgetQty, marketQty));
  }

  function tradeTargets(s, budgetOverride) {
    if (!s) return null;

    const latestLow = Number(s.buy) || 0;
    const latestHigh = Number(s.sell) || 0;
    if (!(latestLow > 0) || !(latestHigh > 0)) return null;

    const f5Low = s.five && Number(s.five.avgLowPrice);
    const f5High = s.five && Number(s.five.avgHighPrice);
    const hLow = s.hour && Number(s.hour.avgLowPrice);
    const hHigh = s.hour && Number(s.hour.avgHighPrice);
    const dLow = s.day && Number(s.day.avgLowPrice);
    const dHigh = s.day && Number(s.day.avgHighPrice);

    const quickLow = avgPresent([latestLow, f5Low], latestLow);
    const quickHigh = avgPresent([latestHigh, f5High], latestHigh);
    const quickSpread = Math.max(1, quickHigh - quickLow);
    let quickBuy = quickLow + quickSpread * 0.18;
    let quickSell = quickHigh - quickSpread * 0.18;

    const normalLow = avgPresent([latestLow, f5Low, hLow], latestLow);
    const normalHigh = avgPresent([latestHigh, f5High, hHigh], latestHigh);
    const normalSpread = Math.max(1, normalHigh - normalLow);
    let normalBuy = normalLow + normalSpread * 0.08;
    let normalSell = normalHigh - normalSpread * 0.08;

    const observedLows = [latestLow, f5Low, hLow, dLow].map(Number).filter(v => v > 0);
    const observedHighs = [latestHigh, f5High, hHigh, dHigh].map(Number).filter(v => v > 0);
    const lowEdge = Math.min(...observedLows);
    const highEdge = Math.max(...observedHighs);
    let patientBuy = Math.max(lowEdge, latestLow * 0.98);
    let patientSell = Math.min(highEdge, latestHigh * 1.02);

    if (s.trend && s.trend.direction === 'rising') patientBuy = Math.max(patientBuy, latestLow * 0.992);
    else if (s.trend && s.trend.direction === 'falling') patientSell = Math.min(patientSell, latestHigh * 1.004);

    const budget = budgetOverride !== undefined ? Number(budgetOverride) : Number(s.budgetUsed || budgetInput || 0);
    const qQuick = s.horizon === 'quick' && Number(s.qty) > 0 ? Number(s.qty) : quantityForHorizon(s, budget, 'quick');
    const qNormal = s.horizon === 'normal' && Number(s.qty) > 0 ? Number(s.qty) : quantityForHorizon(s, budget, 'normal');
    const qPatient = s.horizon === 'patient' && Number(s.qty) > 0 ? Number(s.qty) : quantityForHorizon(s, budget, 'patient');

    return {
      quick: { ...targetMath(quickBuy, quickSell, Math.max(1, qQuick)), qty: qQuick },
      normal: { ...targetMath(normalBuy, normalSell, Math.max(1, qNormal)), qty: qNormal },
      patient: { ...targetMath(patientBuy, patientSell, Math.max(1, qPatient)), qty: qPatient }
    };
  }

  function renderTradeTargets(s, focusHorizon = null) {
    const targets = tradeTargets(s);
    if (!targets) return '';

    const card = (key) => {
      const t = targets[key];
      const cls = t.margin >= 0 ? 'pos' : 'neg';
      return `
        <div class="horizon-card ${key} ${focusHorizon === key ? 'focused' : ''}">
          <div class="horizon-name">${horizonTitle(key)}</div>
          <div class="s-note" style="margin:0 0 7px">${horizonSubtitle(key)}</div>
          <div class="horizon-line"><span>Buy target</span><strong>${fmt(t.buy)}</strong></div>
          <div class="horizon-line"><span>Sell target</span><strong>${fmt(t.sell)}</strong></div>
          <div class="horizon-line"><span>GE tax · 2%</span><strong class="neg">−${fmt(t.tax)}</strong></div>
          <div class="horizon-line"><span>After-tax margin</span><strong class="${cls}">${t.margin >= 0 ? '+' : ''}${fmt(t.margin)}</strong></div>
          <div class="horizon-line"><span>ROI</span><strong class="${cls}">${fmtPct(t.pct)}</strong></div>
          <div class="horizon-line"><span>Suggested qty</span><strong>${fmt(t.qty)}</strong></div>
          <div class="horizon-line"><span>Est. profit</span><strong class="${cls}">${t.profit >= 0 ? '+' : ''}${fmt(t.profit)}</strong></div>
        </div>`;
    };

    const keys = focusHorizon ? [focusHorizon] : ['quick', 'normal', 'patient'];
    return `
      <div class="history-title">${focusHorizon ? 'Selected offer target' : 'Offer targets'}</div>
      <div class="horizon-grid" style="${focusHorizon ? 'grid-template-columns:minmax(0,1fr)' : ''}">
        ${keys.map(card).join('')}
      </div>
      <div class="s-note">Quantity is capped by your budget, the GE 4-hour limit, and a horizon-specific share of recent two-sided market flow. Targets are estimates, not guaranteed fill times; re-check before placing or adjusting an offer.</div>
    `;
  }

  function compactSnapshot(it, budget) {
    if (!it) return null;
    const scored = scoreLiveItem(it, budget, 'normal');
    if (scored) return withTrend(scored);

    const net = it.sell - taxPerUnit(it.sell);
    const margin = net - it.buy;
    const pct = it.buy > 0 ? margin / it.buy * 100 : 0;
    const vol5 = volumeOf(it.five);
    const vol1h = volumeOf(it.hour);
    const vol24 = volumeOf(it.day);
    const midpoint = (it.buy + it.sell) / 2;
    const tradedValue24 = midpoint * vol24;
    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const volumeRatio = vol24 / requiredVol24;
    const affordable = Math.max(0, Math.floor((Number(budget) || 0) / Math.max(it.buy, 1)));
    const marketQty = Math.max(1, Math.floor(vol24 * 0.03));
    const qty = affordable > 0 ? Math.min(affordable, it.limit || affordable, marketQty) : 0;
    const cached = trendCache[String(it.id)];

    return {
      ...it, margin, pct, qty, potential: margin * qty, ranking: -Infinity,
      score: 0, confidence: 'low', vol5, vol1h, vol24, tradedValue24,
      requiredVol24, volumeRatio, trend: cached ? cached.trend : null
    };
  }

  function runSearchMatches() {
    const q = searchQuery.trim().toLowerCase();
    if (!q || !liveItems.length) {
      searchMatches = [];
      return;
    }

    searchMatches = liveItems
      .filter(it => it.name && it.name.toLowerCase().includes(q))
      .sort((a, b) => {
        const an = a.name.toLowerCase();
        const bn = b.name.toLowerCase();
        const ae = an === q ? 0 : an.startsWith(q) ? 1 : 2;
        const be = bn === q ? 0 : bn.startsWith(q) ? 1 : 2;
        return ae - be || an.localeCompare(bn);
      })
      .slice(0, 12);
  }

  async function searchItems() {
    searchLoading = true;
    searchSelected = null;
    render();

    if (!liveItems.length) await fetchLiveData(false);
    runSearchMatches();

    searchLoading = false;
    render();
  }

  async function selectSearchItem(id) {
    searchLoading = true;
    render();

    if (!liveItems.length) await fetchLiveData(false);
    await fetchTrendForItem(id, true);
    const it = liveItems.find(x => String(x.id) === String(id));
    searchSelected = it ? compactSnapshot(it, Number(budgetInput) || 0) : null;

    searchLoading = false;
    chartLoading.search = !!searchSelected;
    render();
    if (searchSelected) {
      await fetchPriceHistory(searchSelected.id, searchChartRange);
      chartLoading.search = false;
      render();
    }
  }

  async function recheckHistoryItem(historyId) {
    const h = suggestionHistory.find(x => x.historyId === historyId);
    if (!h || !h.id) return;
    searchQuery = h.name || '';
    await selectSearchItem(h.id);
    const panel = root.querySelector('#itemSearchPanel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function analyzeTopTrends() {
    if (!liveItems.length) return;
    trendLoading = true;
    render();

    const budget = Number(liveBudget) || 0;
    const preliminary = liveItems
      .map(it => scoreLiveItem(it, budget, 'normal'))
      .filter(Boolean)
      .filter(s => s.confidence !== 'low' && s.volumeRatio >= 0.5 && s.age <= 60 * 60)
      .sort((a, b) => b.ranking - a.ranking)
      .slice(0, 24);

    await Promise.all(preliminary.map(s => fetchTrendForItem(s.id)));
    trendLoading = false;
    computeLiveResults();
    render();
  }

  function buildRefreshSnapshot(it, budget, horizon = 'normal') {
    const scored = scoreLiveItem(it, budget, horizon);
    if (scored) return withTrend(scored);

    const net = it.sell - taxPerUnit(it.sell);
    const fullMargin = net - it.buy;
    const fullPct = it.buy > 0 ? (fullMargin / it.buy) * 100 : 0;
    const vol5 = volumeOf(it.five);
    const vol1h = volumeOf(it.hour);
    const vol24 = volumeOf(it.day);
    const midpoint = (it.buy + it.sell) / 2;
    const tradedValue24 = midpoint * vol24;
    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const volumeRatio = requiredVol24 ? vol24 / requiredVol24 : 0;
    const nowSec = Date.now() / 1000;
    const age = Math.max(it.highTime ? nowSec - it.highTime : Infinity, it.lowTime ? nowSec - it.lowTime : Infinity);
    const qty = Math.max(1, quantityForHorizon(it, budget, horizon));
    const cached = trendCache[String(it.id)];
    const base = {
      ...it, horizon, budgetUsed: budget, qty, vol5, vol1h, vol24, tradedValue24,
      requiredVol24, volumeRatio, age, trend: cached ? cached.trend : null
    };
    const targetSet = tradeTargets(base, budget);
    const target = targetSet && targetSet[horizon];
    const margin = target ? target.margin : fullMargin;
    const pct = target ? target.pct : fullPct;
    const potential = target ? target.profit : margin * qty;

    return {
      ...base, margin, pct, potential, fullMargin, fullPct,
      targetBuy: target ? target.buy : it.buy, targetSell: target ? target.sell : it.sell,
      capitalUsed: (target ? target.buy : it.buy) * qty,
      score: 0, confidence: 'low', refreshedOnly: true, ranking: -Infinity,
      twoSided5: sideVolume(it.five, 'high') > 0 && sideVolume(it.five, 'low') > 0,
      twoSided1h: sideVolume(it.hour, 'high') > 0 && sideVolume(it.hour, 'low') > 0,
      twoSided24: sideVolume(it.day, 'high') > 0 && sideVolume(it.day, 'low') > 0
    };
  }

  async function refreshPreviousSuggestion() {
    if (!lastSuggestion || lastSuggestion === 'none' || !lastSuggestion.id) return;
    const id = lastSuggestion.id;
    suggestionRefreshing = true;
    render();

    await fetchLiveData(false);
    await fetchTrendForItem(id, true);

    const it = liveItems.find(x => String(x.id) === String(id));
    if (it) {
      const refreshed = buildRefreshSnapshot(it, Number(budgetInput) || 0, lastSuggestion.horizon || tradeHorizon || 'normal');
      refreshed.refreshedAt = Date.now();
      rememberSuggestion(refreshed, false);
    }
    suggestionRefreshing = false;
    render();
  }

  async function fetchLiveData(analyzeTrends = true) {
    liveLoading = true;
    liveError = null;
    render();

    try {
      const base = 'https://prices.runescape.wiki/api/v1/osrs';
      if (!mappingCache) {
        const mapRes = await fetch(base + '/mapping');
        if (!mapRes.ok) throw new Error('mapping request failed (' + mapRes.status + ')');
        mappingCache = await mapRes.json();
      }

      const [latestRes, fiveRes, hourRes, dayRes] = await Promise.all([
        fetch(base + '/latest'),
        fetch(base + '/5m'),
        fetch(base + '/1h'),
        fetch(base + '/24h')
      ]);

      if (!latestRes.ok) throw new Error('latest prices request failed (' + latestRes.status + ')');
      if (!fiveRes.ok) throw new Error('5-minute volume request failed (' + fiveRes.status + ')');
      if (!hourRes.ok) throw new Error('1-hour volume request failed (' + hourRes.status + ')');
      if (!dayRes.ok) throw new Error('24-hour volume request failed (' + dayRes.status + ')');

      const latestData = (await latestRes.json()).data || {};
      const fiveData = normalizeAggregate(await fiveRes.json());
      const hourData = normalizeAggregate(await hourRes.json());
      const dayData = normalizeAggregate(await dayRes.json());

      liveItems = mappingCache.map(m => {
        const p = latestData[String(m.id)];
        if (!p || !p.high || !p.low) return null;
        return {
          id: m.id,
          name: m.name,
          limit: m.limit || 0,
          buy: Number(p.low),
          sell: Number(p.high),
          lowTime: Number(p.lowTime) || 0,
          highTime: Number(p.highTime) || 0,
          five: fiveData[String(m.id)] || null,
          hour: hourData[String(m.id)] || null,
          day: dayData[String(m.id)] || null
        };
      }).filter(Boolean);

      liveFetchedAt = Date.now();
    } catch (e) {
      liveItems = [];
      liveError = 'Could not reach the live OSRS price/volume feeds (' +
        (e && e.message ? e.message : 'network error') +
        '). If the API is temporarily unavailable, try Fetch again.';
    }

    liveLoading = false;
    computeLiveResults();
    render();
    if (analyzeTrends && liveItems.length) await analyzeTopTrends();
  }

  function maxReasonableSpreadPct(price) {
    if (price < 20) return 60;
    if (price < 100) return 45;
    if (price < 1000) return 30;
    if (price < 10000) return 22;
    if (price < 100000) return 18;
    return 15;
  }

  function scoreLiveItem(it, budget, horizon = 'normal') {
    if (it.buy <= 0 || it.sell <= 0 || it.buy > budget || !it.limit) return null;

    const net = it.sell - taxPerUnit(it.sell);
    const fullMargin = net - it.buy;
    const fullPct = it.buy > 0 ? (fullMargin / it.buy) * 100 : 0;
    if (fullMargin <= 0 || fullPct <= 0) return null;

    const spreadCap = maxReasonableSpreadPct(it.buy);
    if (fullPct > spreadCap) return null;

    const vol5 = volumeOf(it.five);
    const vol1h = volumeOf(it.hour);
    const vol24 = volumeOf(it.day);
    const high5 = sideVolume(it.five, 'high');
    const low5 = sideVolume(it.five, 'low');
    const high1 = sideVolume(it.hour, 'high');
    const low1 = sideVolume(it.hour, 'low');
    const high24 = sideVolume(it.day, 'high');
    const low24 = sideVolume(it.day, 'low');

    const midpoint = (it.buy + it.sell) / 2;
    const tradedValue24 = midpoint * vol24;
    const requiredVol24 = Math.max(4, Math.ceil(50000000 / Math.max(midpoint, 1)));
    const volumeRatio = vol24 / requiredVol24;
    const expectedHour = Math.max(1, requiredVol24 / 24);
    const expectedFive = Math.max(1, expectedHour / 12);

    const nowSec = Date.now() / 1000;
    const ageHigh = it.highTime ? nowSec - it.highTime : Infinity;
    const ageLow = it.lowTime ? nowSec - it.lowTime : Infinity;
    const age = Math.max(ageHigh, ageLow);

    const minSide24 = Math.max(1, Math.floor(requiredVol24 * 0.08));
    const minSide1 = Math.max(1, Math.floor(expectedHour * 0.18));
    const twoSided24 = high24 >= minSide24 && low24 >= minSide24;
    const twoSided1h = high1 >= minSide1 && low1 >= minSide1;
    const twoSided5 = high5 > 0 && low5 > 0;
    const twoSided = horizon === 'quick' ? twoSided5 : horizon === 'patient' ? twoSided24 : (twoSided1h && twoSided24);

    const hourBuy = it.hour && Number(it.hour.avgLowPrice);
    const hourSell = it.hour && Number(it.hour.avgHighPrice);
    let hourPct = null;
    if (hourBuy > 0 && hourSell > 0) {
      const hourMargin = (hourSell - taxPerUnit(hourSell)) - hourBuy;
      hourPct = (hourMargin / hourBuy) * 100;
    }
    if (hourPct !== null && hourPct > 0) {
      const spreadRatio = fullPct / hourPct;
      if (fullPct > 8 && spreadRatio > 3.5) return null;
    }

    let score = 0;
    if (horizon === 'quick') {
      if (age <= 3 * 60) score += 30;
      else if (age <= 8 * 60) score += 25;
      else if (age <= 15 * 60) score += 16;
      else if (age <= 30 * 60) score += 5;

      if (vol5 >= expectedFive * 3) score += 26;
      else if (vol5 >= expectedFive * 1.3) score += 21;
      else if (vol5 >= expectedFive * 0.6) score += 12;
      else if (vol5 > 0) score += 4;

      if (vol1h >= expectedHour) score += 16;
      else if (vol1h >= expectedHour * 0.5) score += 10;
      else if (vol1h > 0) score += 4;

      if (twoSided5) score += 15;
      if (twoSided1h) score += 7;
      if (hourPct !== null && hourPct > 0 && Math.abs(fullPct - hourPct) <= Math.max(1.2, hourPct * 0.45)) score += 6;
    } else if (horizon === 'patient') {
      if (age <= 15 * 60) score += 10;
      else if (age <= 30 * 60) score += 8;
      else if (age <= 60 * 60) score += 5;
      else if (age <= 2 * 60 * 60) score += 2;

      if (volumeRatio >= 3) score += 34;
      else if (volumeRatio >= 1.5) score += 29;
      else if (volumeRatio >= 1) score += 24;
      else if (volumeRatio >= 0.5) score += 12;

      if (vol1h >= expectedHour) score += 18;
      else if (vol1h >= expectedHour * 0.4) score += 11;
      else if (vol1h > 0) score += 4;

      if (twoSided24) score += 16;
      if (vol5 > 0) score += 4;
      if (hourPct !== null && hourPct > 0 && Math.abs(fullPct - hourPct) <= Math.max(1.5, hourPct * 0.6)) score += 8;
    } else {
      if (age <= 5 * 60) score += 25;
      else if (age <= 15 * 60) score += 20;
      else if (age <= 30 * 60) score += 12;
      else if (age <= 60 * 60) score += 4;

      if (volumeRatio >= 3) score += 27;
      else if (volumeRatio >= 1.5) score += 24;
      else if (volumeRatio >= 1) score += 20;
      else if (volumeRatio >= 0.5) score += 10;

      if (vol1h >= expectedHour) score += 18;
      else if (vol1h >= expectedHour * 0.4) score += 11;
      else if (vol1h > 0) score += 4;

      if (vol5 >= expectedFive) score += 11;
      else if (vol5 > 0) score += 5;
      if (twoSided1h && twoSided24) score += 12;
      if (hourPct !== null && hourPct > 0 && Math.abs(fullPct - hourPct) <= Math.max(1.5, hourPct * 0.5)) score += 7;
    }

    score = Math.max(0, Math.min(100, score));
    const confidence = score >= 75 ? 'high' : score >= 55 ? 'medium' : 'low';

    const qty = quantityForHorizon(it, budget, horizon);
    if (qty <= 0) return null;
    const temp = { ...it, qty, horizon, budgetUsed: budget };
    const targetSet = tradeTargets(temp, budget);
    const target = targetSet && targetSet[horizon];
    if (!target || target.margin <= 0 || target.pct <= 0) return null;

    const potential = target.profit;
    const capitalUsed = target.buy * qty;
    const horizonHours = horizon === 'quick' ? (10 / 60) : horizon === 'patient' ? 8 : 2;
    const capitalEfficiency = capitalUsed > 0 ? (potential / capitalUsed) / horizonHours : 0;
    const confidenceMultiplier = 0.55 + (score / 100) * 0.45;
    const recentMultiplier = horizon === 'patient' ? (age <= 60 * 60 ? 1 : 0.88) : age <= 15 * 60 ? 1 : age <= 30 * 60 ? 0.9 : 0.75;
    const efficiencyWeight = horizon === 'quick' ? 28 : horizon === 'normal' ? 10 : 3;
    const efficiencyMultiplier = 1 + Math.min(0.8, Math.max(0, capitalEfficiency) * efficiencyWeight);
    const ranking = potential * confidenceMultiplier * recentMultiplier * efficiencyMultiplier;

    return {
      ...it, horizon, budgetUsed: budget,
      margin: target.margin, pct: target.pct, targetBuy: target.buy, targetSell: target.sell,
      fullMargin, fullPct, qty, potential, capitalUsed, capitalEfficiency,
      ranking, score, confidence, vol5, vol1h, vol24, tradedValue24,
      requiredVol24, volumeRatio, age, hourPct, twoSided, twoSided5, twoSided1h, twoSided24,
      marketQty: horizonMarketQty(it, horizon)
    };
  }

  function passesQualityFilter(s, level) {
    if (!s) return false;
    const h = s.horizon || 'normal';
    if (level === 'high') {
      if (s.confidence !== 'high') return false;
      if (h === 'quick') return s.twoSided5 && s.twoSided1h && s.age <= 15 * 60 && s.vol5 > 0;
      if (h === 'patient') return s.volumeRatio >= 1 && s.twoSided24 && s.age <= 2 * 60 * 60;
      return s.volumeRatio >= 1 && s.twoSided1h && s.twoSided24 && s.age <= 30 * 60;
    }
    if (level === 'medium') {
      if (s.confidence === 'low') return false;
      if (h === 'quick') return s.twoSided1h && s.age <= 30 * 60;
      if (h === 'patient') return s.volumeRatio >= 0.5 && s.twoSided24 && s.age <= 3 * 60 * 60;
      return s.volumeRatio >= 0.5 && s.twoSided24 && s.age <= 60 * 60;
    }
    return true;
  }

  function computeLiveResults() {
    const budget = Number(liveBudget) || 0;
    const scored = liveItems
      .map(it => scoreLiveItem(it, budget, 'normal'))
      .filter(Boolean)
      .map(withTrend)
      .filter(s => liveLiquidity === 'reliable' ? passesQualityFilter(s, 'high') : passesQualityFilter(s, 'medium'));

    scored.sort((a, b) => b.ranking - a.ranking);
    liveResults = scored.slice(0, 12);
  }

  function computeSuggestion() {
    if (!liveFetchedAt || !liveItems.length || !tradeHorizon) return null;

    const budget = Number(budgetInput) || 0;
    let candidates = liveItems
      .map(it => scoreLiveItem(it, budget, tradeHorizon))
      .filter(Boolean)
      .map(withTrend);

    if (speedFilter === 'high') candidates = candidates.filter(s => passesQualityFilter(s, 'high'));
    else if (speedFilter === 'medium') candidates = candidates.filter(s => passesQualityFilter(s, 'medium'));

    if (trendBias === 'rising') {
      candidates = candidates.filter(s => s.trend && s.trend.direction === 'rising' && (s.trend.ret7d === null || s.trend.ret7d > 0));
    } else if (trendBias === 'avoid-falling') {
      candidates = candidates.filter(s => !s.trend || s.trend.direction !== 'falling');
    }

    if (!candidates.length) return null;
    candidates.sort((a, b) => b.ranking - a.ranking);
    const winner = candidates[0];
    const targetSet = tradeTargets(winner, budget);
    const target = targetSet && targetSet[tradeHorizon];
    if (!target) return winner;
    return {
      ...winner, margin: target.margin, pct: target.pct, potential: target.profit,
      targetBuy: target.buy, targetSell: target.sell, qty: target.qty,
      capitalUsed: target.buy * target.qty
    };
  }

  function ageText(seconds) {
    if (!isFinite(seconds)) return 'unknown age';
    if (seconds < 60) return Math.max(1, Math.round(seconds)) + ' sec old';
    if (seconds < 3600) return Math.round(seconds / 60) + ' min old';
    return (seconds / 3600).toFixed(1) + ' hr old';
  }

  function explainFlip(s) {
    if (!s) return { why: '', risk: '' };
    const h = s.horizon || 'normal';
    const reasons = [];
    if (h === 'quick') {
      reasons.push(fmt(s.vol5) + ' trades in the 5-minute window');
      if (s.twoSided5) reasons.push('active buying and selling on both sides right now');
      reasons.push('latest high/low trades are ' + ageText(s.age));
      reasons.push(fmtPct(s.pct) + ' estimated after-tax ROI at the quicker-fill targets');
    } else if (h === 'patient') {
      reasons.push(fmt(s.vol24) + ' trades over 24h with ' + fmt(s.tradedValue24) + ' gp of turnover');
      if (s.trend) reasons.push((s.trend.direction === 'rising' ? 'positive' : s.trend.direction) + ' multi-day trend (' + fmtPct(s.trend.ret7d) + ' over 7d)');
      reasons.push(fmtPct(s.pct) + ' estimated after-tax ROI for the longer hold');
      reasons.push('quantity is capped to a small share of daily two-sided flow');
    } else {
      reasons.push(fmt(s.vol1h) + ' trades in the last hour and ' + fmt(s.vol24) + ' over 24h');
      if (s.twoSided1h) reasons.push('healthy two-sided hourly activity');
      if (s.trend) reasons.push(s.trend.direction + ' multi-day price direction (' + fmtPct(s.trend.ret7d) + ' over 7d)');
      reasons.push(fmtPct(s.pct) + ' estimated after-tax ROI at the 1–3 hour targets');
    }

    let risk = 'No single red flag dominates, but GE spreads and fill speed can change quickly; re-check before committing the full quantity.';
    if (s.trend && s.trend.direction === 'falling') {
      risk = 'The multi-day trend is falling, which raises the chance that your sell offer has to chase the market lower.';
    } else if (s.trend && (s.trend.ret1d ?? 0) >= 10) {
      risk = 'Price is up ' + fmtPct(s.trend.ret1d) + ' in one day. That momentum can help demand, but a sharp move also increases retracement risk.';
    } else if (s.volumeRatio < 1) {
      risk = 'Volume is below the Ledger’s price-scaled reliability target, so the quoted spread may be less dependable than it looks.';
    } else if (h === 'quick' && !s.twoSided5) {
      risk = 'The most recent 5-minute activity is not balanced on both sides, so a sub-10-minute round trip is less certain.';
    } else if (h === 'patient' && (!s.trend || s.trend.direction === 'mixed')) {
      risk = 'The longer hold has no clearly rising multi-day trend, so overnight price drift is the main uncertainty.';
    }

    return { why: reasons.join('; ') + '.', risk };
  }

  async function suggestFlip() {
    if (!tradeHorizon) {
      alert('Choose Quick, Normal, or Patient before asking the Ledger for a flip.');
      return;
    }
    suggestionLoading = true;
    lastSuggestion = null;
    render();
    if (!liveItems.length) await fetchLiveData(false);

    const budget = Number(budgetInput) || 0;
    const preliminary = liveItems
      .map(it => scoreLiveItem(it, budget, tradeHorizon))
      .filter(Boolean)
      .filter(s => s.confidence !== 'low')
      .sort((a, b) => b.ranking - a.ranking)
      .slice(0, 30);
    await Promise.all(preliminary.map(s => fetchTrendForItem(s.id)));

    const result = computeSuggestion();
    if (result) {
      result.suggestedAt = Date.now();
      result.horizon = tradeHorizon;
      result.budgetUsed = budget;
      rememberSuggestion(result);
    } else {
      lastSuggestion = 'none';
    }
    suggestionLoading = false;
    render();
    if (result) {
      chartLoading.suggestion = true;
      render();
      await fetchPriceHistory(result.id, suggestionChartRange);
      chartLoading.suggestion = false;
      render();
    }
  }

  const PRICE_RANGES = {
    '1d': { label: '1D', timestep: '5m', seconds: 24 * 3600 },
    '7d': { label: '7D', timestep: '1h', seconds: 7 * 24 * 3600 },
    '1m': { label: '1M', timestep: '6h', seconds: 30 * 24 * 3600 },
    '3m': { label: '3M', timestep: '6h', seconds: 90 * 24 * 3600 },
    '6m': { label: '6M', timestep: '24h', seconds: 180 * 24 * 3600 }
  };

  async function fetchPriceHistory(id, rangeKey) {
    const cfg = PRICE_RANGES[rangeKey] || PRICE_RANGES['1m'];
    const key = String(id) + ':' + rangeKey;
    const cached = priceHistoryCache[key];
    if (cached && Date.now() - cached.at < 10 * 60 * 1000) return cached.rows;
    try {
      const url = 'https://prices.runescape.wiki/api/v1/osrs/timeseries?timestep=' + cfg.timestep + '&id=' + encodeURIComponent(id);
      const res = await fetch(url);
      if (!res.ok) throw new Error('history request failed');
      const json = await res.json();
      const cutoff = Math.floor(Date.now() / 1000) - cfg.seconds;
      const rows = (Array.isArray(json.data) ? json.data : [])
        .map(r => ({
          timestamp: Number(r.timestamp) || 0,
          high: Number(r.avgHighPrice) || 0,
          low: Number(r.avgLowPrice) || 0
        }))
        .filter(r => r.timestamp >= cutoff && (r.high > 0 || r.low > 0))
        .sort((a, b) => a.timestamp - b.timestamp);
      priceHistoryCache[key] = { at: Date.now(), rows };
      return rows;
    } catch (e) {
      priceHistoryCache[key] = { at: Date.now(), rows: [], error: true };
      return [];
    }
  }

  function fmtAxisPrice(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 1 : 2) + 'm';
    if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k';
    return fmt(n);
  }

  function chartDateLabel(ts, rangeKey) {
    const d = new Date(Number(ts) * 1000);
    if (rangeKey === '1d') return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function renderPriceSvg(rows, rangeKey) {
    if (!rows || rows.length < 2) return '<div class="empty" style="padding:16px">Not enough historical data was returned for this range.</div>';
    const W = 800, H = 250, L = 62, R = 16, T = 18, B = 34;
    const values = [];
    rows.forEach(r => { if (r.high > 0) values.push(r.high); if (r.low > 0) values.push(r.low); });
    if (!values.length) return '<div class="empty" style="padding:16px">No usable historical prices were returned.</div>';
    let min = Math.min(...values), max = Math.max(...values);
    const pad = Math.max(1, (max - min) * 0.08);
    min -= pad; max += pad;
    if (max <= min) max = min + 1;
    const x = i => L + (i / Math.max(1, rows.length - 1)) * (W - L - R);
    const y = v => T + (max - v) / (max - min) * (H - T - B);
    const line = key => rows.map((r, i) => r[key] > 0 ? x(i).toFixed(1) + ',' + y(r[key]).toFixed(1) : '').filter(Boolean).join(' ');
    const grid = [0, .25, .5, .75, 1].map(fr => {
      const yy = T + fr * (H - T - B);
      const val = max - fr * (max - min);
      return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" class="chart-grid"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="chart-axis">${fmtAxisPrice(val)}</text>`;
    }).join('');
    const first = rows[0], last = rows[rows.length - 1], mid = rows[Math.floor(rows.length / 2)];
    return `<svg class="price-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Historical average high and low prices">
      ${grid}
      <polyline points="${line('high')}" class="chart-high"/>
      <polyline points="${line('low')}" class="chart-low"/>
      <text x="${L}" y="${H-8}" class="chart-axis">${escapeHtml(chartDateLabel(first.timestamp, rangeKey))}</text>
      <text x="${W/2}" y="${H-8}" text-anchor="middle" class="chart-axis">${escapeHtml(chartDateLabel(mid.timestamp, rangeKey))}</text>
      <text x="${W-R}" y="${H-8}" text-anchor="end" class="chart-axis">${escapeHtml(chartDateLabel(last.timestamp, rangeKey))}</text>
    </svg>`;
  }

  function renderPriceHistoryPanel(id, name, rangeKey, slot) {
    if (!id) return '';
    const key = String(id) + ':' + rangeKey;
    const cached = priceHistoryCache[key];
    const isLoading = !!chartLoading[slot];
    const buttons = Object.keys(PRICE_RANGES).map(k => `<button class="chart-range-btn ${rangeKey === k ? 'active' : ''}" data-chart-slot="${slot}" data-chart-id="${id}" data-chart-range="${k}">${PRICE_RANGES[k].label}</button>`).join('');
    let body = '<div class="empty" style="padding:16px">Choose a range to load price history.</div>';
    if (isLoading) body = '<div class="empty" style="padding:16px">Loading historical GE prices…</div>';
    else if (cached) body = renderPriceSvg(cached.rows, rangeKey);
    return `<div class="price-history-panel">
      <div class="history-head"><div><div class="history-title" style="margin:0">Price history</div><div class="s-note" style="margin-top:3px">Average traded high vs. low · market data, not a forecast</div></div><div class="chart-range-row">${buttons}</div></div>

  async function changeChartRange(slot, id, rangeKey) {
    if (!PRICE_RANGES[rangeKey]) return;
    if (slot === 'search') searchChartRange = rangeKey;
    else suggestionChartRange = rangeKey;
    chartLoading[slot] = true;
    render();
    await fetchPriceHistory(id, rangeKey);
    chartLoading[slot] = false;
    render();
  }

  function renderExitPlan(s) {
    if (!s) return '';
    const h = s.horizon || 'normal';
    let expected, reassess, weakens;
    if (h === 'quick') {
      expected = 'Under ~10 minutes';
      reassess = 'If either side is still hanging after ~15–20 minutes';
      weakens = '5-minute two-sided activity dries up, the spread compresses sharply, or the live high moves below your planned exit.';
    } else if (h === 'patient') {
      expected = 'Hours / overnight';
      reassess = 'After ~4–6 hours and again before carrying it into another day';
      weakens = 'the 1-day / 3-day direction turns materially negative, price breaks below its recent range, or liquidity deteriorates.';
    } else {
      expected = '~1–3 hours';
      reassess = 'Around 60–90 minutes, and definitely by the end of the 3-hour thesis window';
      weakens = 'hourly liquidity fades, the spread collapses, or short-term price direction turns against the trade.';
    }
    return `<div class="exit-plan">
      <div class="history-title" style="margin:0 0 8px">Exit / reassessment plan</div>
      <div class="exit-grid">
        <div><span>Intended window</span><strong>${expected}</strong></div>
        <div><span>Reassess</span><strong>${reassess}</strong></div>
        <div class="wide"><span>Thesis weakens if</span><strong>${escapeHtml(weakens)}</strong></div>
      </div>
      <div class="s-note">A missed horizon is a signal to re-check the trade, not automatically convert a Quick trade into Normal or a Normal trade into Patient just because the original offer has not filled.</div>
    </div>`;
  }

  function renderLiveResults() {

  function renderSuggestion() {
    if (suggestionLoading) return `<div class="empty">Evaluating ${tradeHorizon ? horizonTitle(tradeHorizon) : 'your selected'} candidates using horizon-specific liquidity, quantity, trend risk, and capital efficiency…</div>`;
    if (lastSuggestion === 'none') {
      if (!liveFetchedAt) return `<div class="empty">Choose a trade horizon and fetch live prices first. Then Suggest will choose from the validated market candidates.</div>`;
      return `<div class="empty">No candidate currently fits that budget, confidence, trend, and ${tradeHorizon ? horizonTitle(tradeHorizon) : 'horizon'} filter. "Rising" is intentionally strict — try "No ↓" if you want to include flat/mixed markets.</div>`;
    }
    if (!lastSuggestion) {
      return `<div class="empty">Choose Quick, Normal, or Patient, set your budget, then hit Suggest. The Ledger will score the market for that specific trade horizon rather than choosing an item first and deciding the hold time afterward.</div>`;
    }

    const s = lastSuggestion;
    const t = s.trend || null;
    const exp = explainFlip(s);
    const isBadNow = s.refreshedOnly || s.margin <= 0;
    return `
      <div class="suggestion-card">
        <div class="s-item">
          <span class="crown">★</span>${escapeHtml(s.name)}
          <span class="confidence ${s.confidence || 'low'}">${s.confidence || 'low'}</span>

        <div class="suggestion-grid">
          <div class="s-stat"><div class="s-label">Current low</div><div class="s-value">${fmt(s.buy)} gp</div></div>
          <div class="s-stat"><div class="s-label">Current high</div><div class="s-value">${fmt(s.sell)} gp</div></div>
          <div class="s-stat"><div class="s-label">GE limit / 4h</div><div class="s-value">${fmt(s.limit)}</div></div>
          <div class="s-stat"><div class="s-label">Suggested qty</div><div class="s-value">${fmt(s.qty)}</div></div>
        </div>
        <div class="suggestion-grid">
          <div class="s-stat"><div class="s-label">Target ROI</div><div class="s-value ${s.pct >= 0 ? 'pos' : 'neg'}">${fmtPct(s.pct)}</div></div>
          <div class="s-stat"><div class="s-label">1-day trend</div><div class="s-value">${t ? fmtPct(t.ret1d) : '—'}</div></div>
          <div class="s-stat"><div class="s-label">3-day trend</div><div class="s-value">${t ? fmtPct(t.ret3d) : '—'}</div></div>
          <div class="s-stat"><div class="s-label">7-day trend</div><div class="s-value">${t ? fmtPct(t.ret7d) : '—'}</div></div>
        </div>
        <div class="decision-box">
          <div class="decision-line"><b>Why this flip:</b> ${escapeHtml(exp.why)}</div>
          <div class="decision-line"><b>Main risk:</b> ${escapeHtml(exp.risk)}</div>
        </div>
        ${isBadNow ? `<div class="warning-note"><b>Re-check warning:</b> this saved flip no longer passes the normal recommendation filters at its current prices. That does not automatically mean you should panic-sell; it means the original margin/liquidity setup has changed and should be reassessed.</div>` : ''}
        ${t && t.catalyst ? `<div class="warning-note"><b>Volatility flag:</b> recent price movement is unusually strong. The Ledger treats this only as market-data volatility, not evidence of an update or a prediction of what happens next.</div>` : ''}
        <div class="market-note"><b>Current observed market:</b> low ${fmt(s.buy)} gp · high ${fmt(s.sell)} gp · full-spread after-tax margin ${s.fullMargin >= 0 ? '+' : ''}${fmt(s.fullMargin)} gp each. V7.1 ranks the trade using the more conservative ${horizonTitle(s.horizon || 'normal')} target below.</div>
        ${renderTradeTargets(s, s.horizon || 'normal')}
        ${renderExitPlan(s)}
        ${renderPriceHistoryPanel(s.id, s.name, suggestionChartRange, 'suggestion')}
        <div class="s-note">
          Uses about ${fmt(s.capitalUsed || ((s.qty || 0) * (s.targetBuy || s.buy || 0)))} gp of your ${fmt(Number(s.budgetUsed || budgetInput) || 0)} gp budget.
          ${s.refreshedAt ? `Last re-checked ${new Date(s.refreshedAt).toLocaleTimeString()}. ` : ''}
          Capital efficiency affects ranking internally, but the Ledger does not pretend fill-time estimates are precise GP/hour forecasts.
        </div>
        <div class="suggest-actions">
          <button class="btn secondary" id="refreshSuggestionBtn" ${suggestionRefreshing ? 'disabled' : ''}>${suggestionRefreshing ? 'Refreshing…' : 'Refresh This Flip'}</button>
          <button class="btn secondary" id="useSuggestionBtn">Use in Flip Log</button>
        </div>
      </div>
    `;
  }

      ${selectedHtml}

      <div class="history-title">Past Ledger suggestions</div>
      ${filteredHistory.length ? `

          <table>

            <tbody>
              ${filteredHistory.map(h => `
                <tr>
                  <td class="name">${escapeHtml(h.name || 'Unknown')}</td>

  function renderMomentumWatch() {
    if (!liveFetchedAt) {
      return `<div class="empty">Fetch live prices first. After the trend scan, this section will highlight the strongest rising candidates using price and volume data only.</div>`;
    }

    const momentum = liveResults
      .filter(r => r.trend && r.trend.direction === 'rising')
      .sort((a, b) => (b.trend.score || 0) - (a.trend.score || 0))
      .slice(0, 8);

    return `
      ${momentum.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Trend</th><th class="num">1d</th><th class="num">3d</th><th class="num">7d</th><th class="num">24h Vol</th><th>Signal</th></tr></thead>
          <tbody>
            ${momentum.map(r => `
              <tr>
                <td class="name">${escapeHtml(r.name)}</td>
                <td>${trendLabel(r.trend)}</td>
                <td class="num ${r.trend.ret1d < 0 ? 'neg' : 'pos'}">${fmtPct(r.trend.ret1d)}</td>
                <td class="num ${r.trend.ret3d < 0 ? 'neg' : 'pos'}">${fmtPct(r.trend.ret3d)}</td>

      </div>` : `<div class="empty">No strong rising candidates are in the current top results yet.</div>`}
