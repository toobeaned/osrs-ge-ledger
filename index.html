<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>The Exchange Ledger</title>
<style>
:root{
  --ink:#14110d;--panel:#211c16;--raised:#2a231a;--parchment:#f0e1bd;--dim:#c8b991;
  --gold:#d7a94a;--gold2:#ffd36a;--moss:#94d47f;--red:#e2775e;--line:#66583f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--parchment);font-family:Georgia,'Times New Roman',serif}
body{min-height:100vh;background-image:radial-gradient(ellipse at top,rgba(215,169,74,.07),transparent 55%),repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px)}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 64px}
header{text-align:center;margin-bottom:26px}
h1{margin:0;color:var(--gold2);font-size:30px;letter-spacing:3px;text-transform:uppercase}
.sub{margin-top:5px;color:var(--dim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.rule{width:150px;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.profit{display:inline-block;margin-top:12px;padding:10px 16px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.profit small{display:block;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.profit strong{display:block;margin-top:3px;font-family:'Courier New',monospace;font-size:20px}
.pos{color:var(--moss)!important}.neg{color:var(--red)!important}.muted{color:var(--dim)!important}
.panel{margin-top:22px;padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:3px}
.panel.primary{border-color:var(--gold);box-shadow:0 0 0 1px rgba(215,169,74,.12)}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.panel-head h2{margin:0;color:var(--gold);font-size:15px;letter-spacing:2px;text-transform:uppercase}
.hint{font-size:12px;color:var(--dim);font-style:italic}
.controls{display:grid;grid-template-columns:minmax(160px,1fr) auto auto;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.field input{min-width:0;width:100%;padding:9px 10px;color:var(--parchment);background:var(--raised);border:1px solid var(--line);border-radius:2px;font-family:'Courier New',monospace}
.field input:focus{outline:1px solid var(--gold);border-color:var(--gold)}
.btn{height:39px;padding:0 16px;border:0;border-radius:2px;background:var(--gold);color:var(--ink);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.btn:hover{background:var(--gold2)}
.btn.secondary{background:var(--raised);color:var(--gold2);border:1px solid var(--gold)}
.btn.secondary:hover{background:rgba(215,169,74,.1)}
.btn.danger{background:transparent;color:var(--dim);border:1px solid var(--line);height:31px;padding:0 10px;font-size:11px}
.btn.danger:hover{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.note{margin-top:10px;color:var(--dim);font-size:12px;line-height:1.5}
.empty{text-align:center;padding:22px 8px;color:var(--dim);font-style:italic;font-size:13px}
.candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.candidate{padding:13px;border:1px solid var(--line);background:rgba(255,255,255,.018)}
.candidate.top{border-color:var(--gold)}
.candidate-name{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;color:var(--gold2);font-size:16px;font-weight:700}
.candidate-profit{font-family:'Courier New',monospace;color:var(--moss);white-space:nowrap;font-size:13px}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stat label{display:block;color:var(--dim);font-size:9px;letter-spacing:.8px;text-transform:uppercase}
.stat strong{display:block;margin-top:2px;font-family:'Courier New',monospace;font-size:13px;font-weight:600}
.suggestion{margin-top:14px;padding:16px;border:1px dashed var(--gold);background:rgba(215,169,74,.045)}
.suggestion-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--gold2);font-size:20px;font-weight:700}
.target-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.target{padding:14px;border:1px solid var(--line);background:rgba(20,17,13,.3)}
.target label{display:block;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.target strong{display:block;margin-top:4px;font-family:'Courier New',monospace;font-size:24px;color:var(--gold2)}
.suggestion-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.log-form{display:grid;grid-template-columns:1.5fr .7fr 1fr 1.1fr auto;gap:9px;align-items:end}
.section-title{margin:20px 0 8px;color:var(--gold);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.trade-card{padding:13px;border:1px solid var(--line);background:rgba(255,255,255,.016);margin-top:8px}
.trade-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.trade-name{font-size:16px;color:var(--gold2);font-weight:700}
.trade-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}
.close-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:9px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid rgba(102,88,63,.65)}
.timestamp{font-family:'Courier New',monospace;font-size:11px;color:var(--dim)}
.completed .trade-info{grid-template-columns:repeat(5,minmax(0,1fr))}
.loading{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.5}}
@media(max-width:720px){
  .controls{grid-template-columns:1fr 1fr}.controls .field{grid-column:1/-1}
  .candidate-grid{grid-template-columns:1fr}
  .suggestion-meta{grid-template-columns:1fr 1fr}
  .log-form{grid-template-columns:1fr 1fr}.log-form .wide{grid-column:1/-1}.log-form .btn{grid-column:1/-1}
  .trade-info,.completed .trade-info{grid-template-columns:1fr 1fr}
  .close-row{grid-template-columns:1fr 1fr}.close-row .btn{grid-column:1/-1}
}
@media(max-width:440px){.target-grid,.suggestion-meta,.mini-grid,.trade-info,.completed .trade-info{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.controls .btn{width:100%}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="empty loading">Unrolling the ledger…</div></div></div>
<script>
(() => {
  const app = document.getElementById('app');
  const API = 'https://prices.runescape.wiki/api/v1/osrs';
  const TAX_RATE = 0.02;
  const TAX_CAP = 5000000;
  const KEYS = {
    trades: 'osrs_exchange_ledger_core_trades_v8',
    settings: 'osrs_exchange_ledger_core_settings_v8',
    migrated: 'osrs_exchange_ledger_core_migrated_v8'
  };

  let trades = [];
  let budget = 20000000;
  let mapping = null;
  let liveItems = [];
  let candidates = [];
  let fetchedAt = null;
  let loading = false;
  let error = '';
  let suggestionIndex = -1;

  const readJson = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (_) { return fallback; }
  };
  const writeJson = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
  };

  function migrateLegacyLog() {
    if (localStorage.getItem(KEYS.migrated)) return;
    const legacy = readJson('osrs_ge_ledger_fliplog', []);
    if (Array.isArray(legacy) && legacy.length && !trades.length) {
      trades = legacy.map((f, i) => ({
        id: f.id || ('legacy-' + i + '-' + Date.now()),
        name: String(f.name || 'Unknown item'),
        qty: Number(f.qty) || 1,
        buy: Number(f.buy) || 0,
        sell: Number(f.sell) || 0,
        boughtAt: f.createdAt || null,
        soldAt: f.createdAt || null,
        profit: Number.isFinite(Number(f.profit)) ? Number(f.profit) : ((Number(f.sell)||0) - (Number(f.buy)||0)) * (Number(f.qty)||1),
        status: 'closed',
        legacy: true
      }));
      writeJson(KEYS.trades, trades);
    }
    localStorage.setItem(KEYS.migrated, '1');
  }

  function load() {
    trades = readJson(KEYS.trades, []);
    const settings = readJson(KEYS.settings, {});
    if (Number(settings.budget) > 0) budget = Number(settings.budget);
    migrateLegacyLog();
    render();
  }

  const fmt = n => Number.isFinite(Number(n)) ? Math.round(Number(n)).toLocaleString('en-US') : '—';
  const money = n => (Number(n) >= 0 ? '+' : '-') + fmt(Math.abs(Number(n) || 0)) + ' gp';
  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const taxPerUnit = sell => Math.min(Math.floor((Number(sell)||0) * TAX_RATE), TAX_CAP);
  const volumeOf = row => row ? (Number(row.volume) || (Number(row.highPriceVolume)||0) + (Number(row.lowPriceVolume)||0)) : 0;
  const sideVolume = (row, side) => row ? (Number(row[side === 'high' ? 'highPriceVolume' : 'lowPriceVolume']) || Math.floor(volumeOf(row)/2)) : 0;
  const positiveAvg = (vals, fallback) => {
    const a = vals.map(Number).filter(v => v > 0 && Number.isFinite(v));
    return a.length ? a.reduce((x,y)=>x+y,0)/a.length : fallback;
  };
  function normalizeAggregate(json) {
    const raw = json && json.data ? json.data : {};
    const out = {};
    if (Array.isArray(raw)) raw.forEach(r => { if (r && r.id != null) out[String(r.id)] = r; });
    else Object.keys(raw || {}).forEach(k => out[String(k)] = raw[k] || {});
    return out;
  }
  function spreadCap(price) {
    if (price < 20) return 80;
    if (price < 100) return 55;
    if (price < 1000) return 35;
    if (price < 10000) return 25;
    if (price < 100000) return 18;
    if (price < 1000000) return 12;
    return 8;
  }

  function scoreItem(it) {
    if (!(it.low > 0) || !(it.high > 0) || !(it.limit > 0) || it.low > budget) return null;

    const now = Date.now()/1000;
    const quoteAge = Math.max(it.lowTime ? now-it.lowTime : Infinity, it.highTime ? now-it.highTime : Infinity);
    if (quoteAge > 60*60) return null;

    const fiveLow = it.five && Number(it.five.avgLowPrice);
    const fiveHigh = it.five && Number(it.five.avgHighPrice);
    const baseLow = positiveAvg([it.low, fiveLow], it.low);
    const baseHigh = positiveAvg([it.high, fiveHigh], it.high);
    if (!(baseHigh > baseLow)) return null;

    const rawSpread = baseHigh - baseLow;
    const rawPct = rawSpread / baseLow * 100;
    if (rawPct > spreadCap(baseLow)) return null;

    // Give up a small piece of the observed spread to improve the chance of filling.
    const buy = Math.max(1, Math.round(baseLow + rawSpread * 0.08));
    const sell = Math.max(1, Math.round(baseHigh - rawSpread * 0.08));
    const tax = taxPerUnit(sell);
    const margin = sell - tax - buy;
    if (margin <= 0) return null;

    const roi = margin / buy * 100;
    if (roi < 0.15) return null;

    const high1 = sideVolume(it.hour, 'high');
    const low1 = sideVolume(it.hour, 'low');
    const high24 = sideVolume(it.day, 'high');
    const low24 = sideVolume(it.day, 'low');
    const flow1 = Math.min(high1, low1);
    const flow24 = Math.min(high24, low24);
    if (flow24 < 2 || (flow1 < 1 && volumeOf(it.five) < 1)) return null;

    const budgetQty = Math.floor(budget / buy);
    const marketQty = flow1 > 0 ? Math.max(1, Math.floor(flow1 * 0.10)) : Math.max(1, Math.floor(flow24 * 0.01));
    const qty = Math.max(0, Math.min(budgetQty, Number(it.limit)||budgetQty, marketQty));
    if (qty < 1) return null;

    const capital = buy * qty;
    const potential = margin * qty;
    const utilization = budget > 0 ? capital / budget : 0;
    const freshness = quoteAge <= 10*60 ? 1 : quoteAge <= 30*60 ? 0.92 : 0.82;
    const utilizationFactor = 0.70 + 0.30 * Math.min(1, utilization / 0.25);
    const ranking = potential * freshness * utilizationFactor;

    return {...it, buy, sell, tax, margin, roi, qty, capital, potential, utilization, quoteAge, ranking, vol1: volumeOf(it.hour), vol24: volumeOf(it.day)};
  }

  function computeCandidates() {
    candidates = liveItems.map(scoreItem).filter(Boolean).sort((a,b)=>b.ranking-a.ranking).slice(0, 20);
    if (suggestionIndex >= candidates.length) suggestionIndex = candidates.length ? 0 : -1;
  }

  async function fetchMarket() {
    loading = true; error = ''; render();
    try {
      if (!mapping) {
        const r = await fetch(API + '/mapping');
        if (!r.ok) throw new Error('mapping ' + r.status);
        mapping = await r.json();
      }
      const [latestR, fiveR, hourR, dayR] = await Promise.all([
        fetch(API + '/latest'), fetch(API + '/5m'), fetch(API + '/1h'), fetch(API + '/24h')
      ]);
      if (!latestR.ok || !fiveR.ok || !hourR.ok || !dayR.ok) throw new Error('price feed unavailable');
      const latest = (await latestR.json()).data || {};
      const five = normalizeAggregate(await fiveR.json());
      const hour = normalizeAggregate(await hourR.json());
      const day = normalizeAggregate(await dayR.json());
      liveItems = mapping.map(m => {
        const p = latest[String(m.id)];
        if (!p || !p.low || !p.high) return null;
        return {
          id:m.id,name:m.name,limit:Number(m.limit)||0,
          low:Number(p.low),high:Number(p.high),lowTime:Number(p.lowTime)||0,highTime:Number(p.highTime)||0,
          five:five[String(m.id)]||null,hour:hour[String(m.id)]||null,day:day[String(m.id)]||null
        };
      }).filter(Boolean);
      fetchedAt = Date.now();
      suggestionIndex = -1;
      computeCandidates();
    } catch (e) {
      liveItems = []; candidates = []; suggestionIndex = -1;
      error = 'Could not reach the OSRS Wiki price feeds. Try again in a moment.';
    }
    loading = false; render();
  }

  function suggest() {
    if (!candidates.length) return;
    suggestionIndex = 0;
    render();
  }
  function nextSuggestion() {
    if (!candidates.length) return;
    suggestionIndex = suggestionIndex < 0 ? 0 : (suggestionIndex + 1) % candidates.length;
    render();
  }
  function useCandidate(id) {
    const idx = candidates.findIndex(x => String(x.id) === String(id));
    if (idx >= 0) { suggestionIndex = idx; render(); document.getElementById('suggestionPanel')?.scrollIntoView({behavior:'smooth',block:'start'}); }
  }

  function toLocalInputValue(date = new Date()) {
    const pad = n => String(n).padStart(2,'0');
    return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'T'+pad(date.getHours())+':'+pad(date.getMinutes());
  }
  function parseLocalInput(v) { const d = new Date(v); return Number.isNaN(d.getTime()) ? new Date() : d; }
  function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v); return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString();
  }
  function durationText(start, end) {
    if (!start || !end) return '—';
    let ms = new Date(end)-new Date(start);
    if (!Number.isFinite(ms) || ms < 0) return '—';
    const mins = Math.floor(ms/60000);
    const days = Math.floor(mins/1440); const hrs = Math.floor((mins%1440)/60); const m = mins%60;
    if (days) return days+'d '+hrs+'h';
    if (hrs) return hrs+'h '+m+'m';
    return mins+'m';
  }
  function elapsedText(start) { return start ? durationText(start, new Date().toISOString()) : '—'; }

  function saveTrades(){ writeJson(KEYS.trades,trades); }
  function logBuy() {
    const name = document.getElementById('buyName').value.trim();
    const qty = Number(document.getElementById('buyQty').value);
    const buy = Number(document.getElementById('buyPrice').value);
    const boughtAt = parseLocalInput(document.getElementById('buyTime').value).toISOString();
    if (!name || !(qty > 0) || !(buy > 0)) return;
    trades.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),name,qty,buy,boughtAt,sell:null,soldAt:null,profit:null,status:'open'});
    saveTrades(); render();
  }
  function closeTrade(id) {
    const t = trades.find(x => x.id === id); if (!t) return;
    const priceEl = document.getElementById('sell-'+id); const timeEl = document.getElementById('soldtime-'+id);
    const sell = Number(priceEl && priceEl.value);
    if (!(sell > 0)) return;
    const soldAt = parseLocalInput(timeEl && timeEl.value).toISOString();
    t.sell = sell; t.soldAt = soldAt; t.profit = (sell - t.buy) * t.qty; t.status = 'closed';
    saveTrades(); render();
  }
  function removeTrade(id) {
    if (!confirm('Remove this trade from the Ledger?')) return;
    trades = trades.filter(x=>x.id!==id); saveTrades(); render();
  }
  function fillLogFromSuggestion() {
    const s = candidates[suggestionIndex]; if (!s) return;
    const n=document.getElementById('buyName'),q=document.getElementById('buyQty'),p=document.getElementById('buyPrice');
    if(n)n.value=s.name;if(q)q.value=s.qty;if(p)p.value=s.buy;
    document.getElementById('tradeLog')?.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function totalProfit() { return trades.filter(t=>t.status==='closed').reduce((sum,t)=>sum+(Number(t.profit)||0),0); }

  function renderCandidate(c, i) {
    return `<div class="candidate ${i===0?'top':''}">
      <div class="candidate-name"><span>${i===0?'★ ':''}${esc(c.name)}</span><span class="candidate-profit">${money(c.potential)}</span></div>
      <div class="mini-grid">
        <div class="stat"><label>Buy</label><strong>${fmt(c.buy)}</strong></div>
        <div class="stat"><label>Sell</label><strong>${fmt(c.sell)}</strong></div>
        <div class="stat"><label>Qty</label><strong>${fmt(c.qty)}</strong></div>
        <div class="stat"><label>Capital</label><strong>${fmt(c.capital)}</strong></div>
      </div>
      <div class="actions"><button class="btn secondary" data-use="${c.id}">View</button></div>
    </div>`;
  }

  function renderSuggestion() {
    if (suggestionIndex < 0 || !candidates[suggestionIndex]) return `<div class="empty">Fetch the market, then press Suggest Flip.</div>`;
    const s = candidates[suggestionIndex];
    return `<div class="suggestion">
      <div class="suggestion-title"><span>★ ${esc(s.name)}</span><span class="pos">${money(s.potential)}</span></div>
      <div class="target-grid">
        <div class="target"><label>Buy price</label><strong>${fmt(s.buy)} gp</strong></div>
        <div class="target"><label>Sell price</label><strong>${fmt(s.sell)} gp</strong></div>
      </div>
      <div class="suggestion-meta">
        <div class="stat"><label>Suggested qty</label><strong>${fmt(s.qty)}</strong></div>
        <div class="stat"><label>Capital used</label><strong>${fmt(s.capital)} gp</strong></div>
        <div class="stat"><label>After-tax margin</label><strong class="pos">${fmt(s.margin)} ea</strong></div>
        <div class="stat"><label>After-tax ROI</label><strong class="pos">${s.roi.toFixed(2)}%</strong></div>
      </div>
      <div class="note">Sell target includes the Ledger's fixed 2% GE-tax calculation (5m cap per item). Targets are based only on current/recent GE price and activity data; they are not predictions of fill time or future price.</div>
      <div class="actions">
        <button class="btn" id="nextSuggestion">Next Suggestion</button>
        <button class="btn secondary" id="logSuggestion">Log This Buy</button>
        <button class="btn secondary" id="refreshMarket">Refresh Market</button>
      </div>
    </div>`;
  }

  function renderOpenTrade(t) {
    return `<div class="trade-card">
      <div class="trade-head"><div><div class="trade-name">${esc(t.name)}</div><div class="timestamp">Bought ${fmtDate(t.boughtAt)} · open ${elapsedText(t.boughtAt)}</div></div><button class="btn danger" data-remove="${t.id}">Remove</button></div>
      <div class="trade-info">
        <div class="stat"><label>Qty</label><strong>${fmt(t.qty)}</strong></div>
        <div class="stat"><label>Buy price</label><strong>${fmt(t.buy)}</strong></div>
        <div class="stat"><label>Capital</label><strong>${fmt(t.qty*t.buy)}</strong></div>
        <div class="stat"><label>Status</label><strong class="muted">Open</strong></div>
      </div>
      <div class="close-row">
        <div class="field"><label>Net sold price / item</label><input id="sell-${t.id}" type="number" min="1" placeholder="From GE history"></div>
        <div class="field"><label>Sold time</label><input id="soldtime-${t.id}" type="datetime-local" value="${toLocalInputValue()}"></div>
        <button class="btn" data-close="${t.id}">Close Trade</button>
      </div>
      <div class="note">Enter the net per-item sale value shown in GE history. The log does not subtract tax again.</div>
    </div>`;
  }

  function renderClosedTrade(t) {
    return `<div class="trade-card completed">
      <div class="trade-head"><div><div class="trade-name">${esc(t.name)}</div><div class="timestamp">${t.legacy ? 'Imported from the old Flip Log · duration unavailable' : fmtDate(t.boughtAt)+' → '+fmtDate(t.soldAt)}</div></div><button class="btn danger" data-remove="${t.id}">Remove</button></div>
      <div class="trade-info">
        <div class="stat"><label>Qty</label><strong>${fmt(t.qty)}</strong></div>
        <div class="stat"><label>Buy</label><strong>${fmt(t.buy)}</strong></div>
        <div class="stat"><label>Sell</label><strong>${fmt(t.sell)}</strong></div>
        <div class="stat"><label>Duration</label><strong>${t.legacy?'—':durationText(t.boughtAt,t.soldAt)}</strong></div>
        <div class="stat"><label>Profit</label><strong class="${Number(t.profit)>=0?'pos':'neg'}">${money(t.profit)}</strong></div>
      </div>
    </div>`;
  }

  function render() {
    const profit = totalProfit();
    const open = trades.filter(t=>t.status==='open').sort((a,b)=>new Date(b.boughtAt||0)-new Date(a.boughtAt||0));
    const closed = trades.filter(t=>t.status==='closed').sort((a,b)=>new Date(b.soldAt||0)-new Date(a.soldAt||0));
    app.innerHTML = `<div class="wrap">
      <header>
        <h1>The Exchange Ledger</h1><div class="sub">Grand Exchange · Core</div><div class="rule"></div>
        <div class="profit"><small>Realized profit</small><strong class="${profit>=0?'pos':'neg'}">${money(profit)}</strong></div>
      </header>

      <section class="panel primary">
        <div class="panel-head"><h2>Find Flips</h2><div class="hint">Live GE prices · simple liquidity + after-tax margin filter</div></div>
        <div class="controls">
          <div class="field"><label>GP available</label><input id="budget" type="number" min="1" value="${Math.round(budget)}"></div>
          <button class="btn" id="fetch" ${loading?'disabled':''}>${loading?'Fetching…':'Find Flips'}</button>
          <button class="btn secondary" id="suggest" ${!candidates.length?'disabled':''}>Suggest Flip</button>
        </div>
        ${error?`<div class="empty neg">${esc(error)}</div>`:''}
        ${loading?`<div class="empty loading">Reading the Grand Exchange…</div>`:''}
        ${!loading && fetchedAt && !candidates.length?`<div class="empty">No flips passed the basic filters for this budget. Refresh the market later or change the budget.</div>`:''}
        ${!loading && candidates.length?`<div class="candidate-grid">${candidates.slice(0,8).map(renderCandidate).join('')}</div><div class="note">Prices refreshed ${new Date(fetchedAt).toLocaleTimeString()}. The list is ranked mainly by estimated absolute profit, with a small penalty when a trade can use only a tiny fraction of the entered bankroll.</div>`:''}
      </section>

      <section class="panel" id="suggestionPanel">
        <div class="panel-head"><h2>Suggested Flip</h2><div class="hint">One candidate at a time · use Next Suggestion when you want another</div></div>
        ${renderSuggestion()}
      </section>

      <section class="panel" id="tradeLog">
        <div class="panel-head"><h2>Trade Log</h2><div class="hint">Log the buy now; add the net sale price when it sells</div></div>
        <div class="log-form">
          <div class="field wide"><label>Item</label><input id="buyName" placeholder="Item name"></div>
          <div class="field"><label>Qty</label><input id="buyQty" type="number" min="1" placeholder="1"></div>
          <div class="field"><label>Buy price / item</label><input id="buyPrice" type="number" min="1" placeholder="0"></div>
          <div class="field"><label>Bought time</label><input id="buyTime" type="datetime-local" value="${toLocalInputValue()}"></div>
          <button class="btn" id="logBuy">Log Buy</button>
        </div>
        <div class="note">For closed trades, use the net per-item sale value from GE history. The log does not calculate GE tax because your GE-history sale value already has it removed.</div>

        <div class="section-title">Open Positions</div>
        ${open.length?open.map(renderOpenTrade).join(''):`<div class="empty">No open positions.</div>`}

        <div class="section-title">Completed Trades</div>
        ${closed.length?closed.map(renderClosedTrade).join(''):`<div class="empty">No completed trades yet.</div>`}
      </section>
    </div>`;
    wire();
  }

  function wire() {
    document.getElementById('budget')?.addEventListener('change', e => {
      const v=Number(e.target.value); if(v>0){budget=v;writeJson(KEYS.settings,{budget});if(liveItems.length){computeCandidates();suggestionIndex=-1;render();}}
    });
    document.getElementById('fetch')?.addEventListener('click', fetchMarket);
    document.getElementById('suggest')?.addEventListener('click', suggest);
    document.getElementById('nextSuggestion')?.addEventListener('click', nextSuggestion);
    document.getElementById('refreshMarket')?.addEventListener('click', fetchMarket);
    document.getElementById('logSuggestion')?.addEventListener('click', fillLogFromSuggestion);
    document.getElementById('logBuy')?.addEventListener('click', logBuy);
    document.querySelectorAll('[data-use]').forEach(b=>b.addEventListener('click',()=>useCandidate(b.dataset.use)));
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeTrade(b.dataset.close)));
    document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeTrade(b.dataset.remove)));
  }

  load();
})();
</script>
</body>
</html>
